# Thoryn provisioning — the STUB the Thoryn GitHub App dispatches (SSO-3719; oauthy SSO-3660 / SSO-3665). It only
# forwards the App's inputs to the reusable workflow: `.thoryn/workflow.yaml` holds the run-time configuration (files,
# env, fixRequest, apply toggles), the `with:` block the job shape. Lint both: `thoryn provision workflow check`.
# The App never holds a credential to the `thoryn` workspace: each called job signs in as THIS repository's own
# workload identity (.thoryn/connection.json) in an environment of THIS repository — the unprotected `-plan` one for
# a read-only plan on every pull request, the reviewed one (required reviewers) for the apply on main.
name: Thoryn provisioning
run-name: "Thoryn provisioning ${{ inputs.mode }} ${{ inputs.head_sha }} check-run:${{ inputs.check_run_id }}"

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "plan (pull request, read-only) or apply (default branch, reviewed)"
        required: true
        type: choice
        options: [plan, apply]
      head_sha:
        description: "The commit to plan or apply"
        required: true
        type: string
      check_run_id:
        description: "The Thoryn GitHub App check run this run reports to"
        required: true
        type: string
      pr_number:
        description: "The pull request (plan only)"
        required: false
        type: string
        default: ""

concurrency:
  group: thoryn-provisioning-${{ inputs.mode }}
  cancel-in-progress: false

permissions: {}

jobs:
  # thoryn-provisioning: apply-job
  provisioning:
    uses: thoryn-io/thoryn-cli/.github/workflows/provisioning.yml@cli-v0.43.0
    permissions:
      id-token: write
      checks: write
      contents: read
    with:
      mode: ${{ inputs.mode }}
      head_sha: ${{ inputs.head_sha }}
      check_run_id: ${{ inputs.check_run_id }}
      pr_number: ${{ inputs.pr_number }}
      plan-environment: thoryn-provision-e2e-plan
      apply-environment: thoryn-provision-e2e
      issuer: https://auth.stg.thoryn.org
