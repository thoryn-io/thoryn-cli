name: provision-e2e

# SSO-2951 (epic SSO-2947) — demo caller for the reusable provisioning Action
# (.github/actions/provision). It configures the product as a real customer against
# SHARED STAGING using only the real product APIs via the `thoryn` CLI, then deletes
# what it created.
#
# AS-CODE AUTH (SSO-2951): sign-in is driven by the committed connection contract
# `.thoryn/connection.json` (SSO-2948), not by imperative bash + workflow inputs. The
# Action runs `thoryn login --connection .thoryn/connection.json`; the CLI derives the
# per-tenant issuer, gateway and scopes from the contract. The ONLY secret this workflow
# injects is `THORYN_CLI_CI_CLIENT_SECRET` (the env var the contract's `auth.secretEnv`
# names) — the client id, workspace and scopes are all in the committed contract.
#
# The contract binds to the `thoryn` workspace and provisions an EPHEMERAL OAuth client
# inside it (a customer-plane, tenant-scoped credential cannot create workspaces, so the
# run does not mint a fresh one). The ephemeral client is the sole per-run resource; it is
# deleted on exit.
#
# Manual only (workflow_dispatch): it mutates a shared-staging workspace and needs the
# THORYN_CLI_CI_CLIENT_SECRET secret, so it must not fire on push/PR. A nightly schedule
# can be added once the prerequisites below are live.
#
# ONE-TIME OPERATOR SETUP (see `.thoryn/README.md` "One-time bootstrap"):
#   * A founder mints the CI machine client once via the customer plane
#     (`thoryn provision ci-identity`, SSO-2952) and pastes its clientId into
#     `.thoryn/connection.json` (replacing the REPLACE_AFTER_BOOTSTRAP marker).
#   * The `THORYN_CLI_CI_CLIENT_SECRET` repository secret is set to that client's secret.
#
# Until the machine client is minted + the contract's clientId filled in, this workflow is
# expected to fail at sign-in. Do NOT wire it into a required gate before it is verified
# green once by hand.

on:
  workflow_dispatch:
    inputs:
      hub:
        description: "Hub base URL to provision against (supplied to the CLI as THORYN_HUB)."
        required: false
        default: "https://hub.stg.thoryn.org"
      recipe:
        description: "Bundled workspace-less recipe to apply."
        required: false
        default: "ci-signin"

# Serialize: never let two provisioning runs race on the shared workspace.
concurrency:
  group: provision-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Check out thoryn-cli
        uses: actions/checkout@v4

      - name: Provision as a real customer (build + sign in from contract + apply + teardown)
        id: provision
        uses: ./.github/actions/provision
        with:
          # The ONLY injected secret — the env var the connection contract's auth.secretEnv names.
          client-secret: ${{ secrets.THORYN_CLI_CI_CLIENT_SECRET }}
          hub: ${{ inputs.hub }}
          recipe: ${{ inputs.recipe }}

      # Downstream consumers use the Action's outputs. The teardown inside the Action
      # runs on exit regardless, so the ephemeral client id is only valid for the life
      # of the job (the workspace + issuer persist).
      - name: Show provisioned identifiers
        run: |
          echo "workspace-slug = ${{ steps.provision.outputs.workspace-slug }}"
          echo "client-id      = ${{ steps.provision.outputs.client-id }}"
          echo "issuer         = ${{ steps.provision.outputs.issuer }}"
