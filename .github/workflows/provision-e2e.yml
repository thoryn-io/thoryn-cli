name: provision-e2e

# SSO-2944 (epic SSO-2934) — demo caller for the reusable provisioning Action
# (.github/actions/provision). It configures the product as a real customer against
# SHARED STAGING using only the real product APIs via the `thoryn` CLI, then deletes
# what it created.
#
# THE PIVOT (SSO-2944): CI authenticates with a CUSTOMER-PLANE, TENANT-SCOPED
# client-credentials API key the operator mints themselves. Such a key CANNOT create
# workspaces, so the run provisions an EPHEMERAL OAuth client inside a STANDING
# workspace the operator owns (not a fresh workspace per run). The ephemeral client is
# the sole per-run resource; it is deleted on exit.
#
# Manual only (workflow_dispatch): it mutates a shared-staging workspace and needs the
# THORYN_API_KEY secret, so it must not fire on push/PR. A nightly schedule can be
# added once the prerequisites below are live.
#
# ONE-TIME OPERATOR SETUP (see the repo README "CI provisioning setup" section):
#   * A STANDING workspace on staging the operator owns (e.g. `ci-standing`).
#   * A STANDING test user in that workspace (for the downstream sign-in leg).
#   * A CUSTOMER-PLANE `client_credentials` API key scoped to that workspace, granted
#     `tenant:applications.write` + `tenant:applications.read`.
#   * The `THORYN_API_KEY` repository secret set to `<client-id>:<client-secret>`.
#   * The `workspace-slug` input / `CI_WORKSPACE_SLUG` var set to the standing slug.
#
# Until the standing workspace + key exist this workflow is expected to fail at sign-in
# / apply. Do NOT wire it into a required gate before it is verified green once by hand.

on:
  workflow_dispatch:
    inputs:
      issuer:
        description: "Hub issuer to provision against."
        required: false
        default: "https://hub.stg.thoryn.org"
      recipe:
        description: "Bundled workspace-less recipe to apply."
        required: false
        default: "ci-signin"
      workspace-slug:
        description: "Standing workspace slug the API key is scoped to (provisions into it; not created)."
        required: true

# Serialize: never let two provisioning runs race on the shared standing workspace.
concurrency:
  group: provision-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Check out thoryn-cli
        uses: actions/checkout@v4

      - name: Provision as a real customer (build + sign in + apply + teardown)
        id: provision
        uses: ./.github/actions/provision
        with:
          api-key: ${{ secrets.THORYN_API_KEY }}
          workspace-slug: ${{ inputs.workspace-slug }}
          issuer: ${{ inputs.issuer }}
          recipe: ${{ inputs.recipe }}

      # Downstream consumers use the Action's outputs. The teardown inside the Action
      # runs on exit regardless, so the ephemeral client id is only valid for the life
      # of the job (the standing workspace + issuer persist).
      - name: Show provisioned identifiers
        run: |
          echo "workspace-slug = ${{ steps.provision.outputs.workspace-slug }}"
          echo "client-id      = ${{ steps.provision.outputs.client-id }}"
          echo "issuer         = ${{ steps.provision.outputs.issuer }}"
