name: provision-e2e

# SSO-3090 (epic SSO-3087) — demo caller for the reusable provisioning Action
# (.github/actions/provision). thoryn-cli DOGFOODS its own provisioning-as-code: the Action signs in
# from the committed connection contract (`.thoryn/connection.json`, SSO-2951) and converges the
# committed provisioning file (`.thoryn/provision.yaml`) with `thoryn provision apply` (SSO-3088/3089)
# against SHARED STAGING, then `thoryn provision destroy`s it on exit. Real product APIs only.
#
# This workflow injects NO secret (SSO-3690, parent SSO-3659 — the credential ladder's rung 4, "courier:
# never"). The contract is a `workload_identity` connection: the job requests its own GitHub Actions OIDC
# token (`permissions: id-token: write`) and the CLI exchanges it under the `thoryn-cli-ci` workload identity
# trust for a short-lived token of the trust's `wi_…` client. The client id, workspace, scopes, the trust's
# pins and the desired resources are all in the committed `.thoryn/` files.
#
# The trust PINS this job (oauthy hub `GithubActionsTrustPolicy`): the repository by its immutable ids, the
# GitHub environment `thoryn-provision-e2e` the job declares below (a production-plane trust must pin one),
# `ref` = `refs/heads/main` (so only a dispatch on `main` can sign in — a pull request never can), and
# GitHub-hosted runners only. Change any of these here and the sign-in is refused with `invalid_client`
# until the trust is changed to match (`.thoryn/connection.json`'s `auth.github` mirrors the pins so the
# CLI can name the field that differs).
#
# The file declares the CLI's login client `cli` (production plane, `retain: true`), the long-lived SANDBOX
# `cli-ci` (`retain: true`) and a loopback OAuth client inside the sandbox. THE PLATFORM IS THE LEDGER (SSO-3715 /
# SSO-3717; oauthy ADR 2026-10-15-platform-is-the-ledger-no-committed-provisioning-receipt): nothing is written
# beside the file — no receipt — and `destroy` is OWNER-GATED: the CI identity removes only what the platform says
# it OWNS, so the teardown removes EXACTLY the per-run loopback client (this identity created it) and leaves `cli`
# and `cli-ci` as `retained by the file` rows. This workflow ASSERTS that from the destroy's JSON document on every
# run — the ADR's dogfood verification, run rather than reasoned. A leftover loopback client from a failed run is
# matched by its converge key on the next apply, never duplicated (see `.thoryn/provision.yaml`).
#
# Manual only (workflow_dispatch): it mutates a shared-staging workspace, so it must not fire on push/PR.
# Requires cli-v0.36.0 or newer (the first release with `apply` / `destroy --output json` and no receipt, SSO-3715;
# `workload_identity` connection contracts are cli-v0.31.0+) — pin one with the cli-version input until it is the latest.
#
# ONE-TIME OPERATOR SETUP (see `.thoryn/README.md` "A founder creates the trust once"): a founder creates
# the `thoryn-cli-ci` trust with `thoryn workload-identity trusts create`, pastes its `wi_…` client id into
# `.thoryn/connection.json` and the sandbox's `grants:` subject in `.thoryn/provision.yaml`, and removes the
# retired `cli-ci` client together with the repository secret that carried its client secret. Nothing is
# stored in GitHub for this workflow — no secret, no variable.

on:
  workflow_dispatch:
    inputs:
      hub:
        description: "Platform base issuer to provision against (supplied to the CLI as THORYN_ISSUER + its THORYN_HUB alias)."
        required: false
        default: "https://hub.stg.thoryn.org"
      cli-version:
        description: "cli-v* release tag to run (default: latest). Needs cli-v0.36.0 or newer (apply/destroy --output json, no receipt — SSO-3715)."
        required: false
        default: ""
      destroy:
        description: "Remove what the run created on exit (\"true\"/\"false\") and assert the destroy's scope. `cli` and the sandbox are `retain: true` and are never removed."
        required: false
        default: "true"
      foreign-environment-id:
        description: "Id of an environment in the workspace that the CI identity must NOT reach (e.g. the workspace's production environment). When set, the run asserts a GET of it answers 404. Leave empty to assert list confinement only."
        required: false
        default: ""

# Serialize: never let two provisioning runs race on the shared workspace (the file's sandbox slug is fixed).
concurrency:
  group: provision-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    # SSO-3690 — the trust pins this GitHub environment (`sub` = repo:thoryn-io/thoryn-cli:environment:thoryn-provision-e2e).
    # GitHub creates the environment on the first run that references it; it holds no secret and no variable.
    environment: thoryn-provision-e2e
    permissions:
      contents: read
      id-token: write # lets the job request its own OIDC token — the ONLY credential this job has
    steps:
      - name: Check out thoryn-cli (the .thoryn/ files)
        uses: actions/checkout@v4

      - name: Provision as a real customer (sign in from contract + provision apply + destroy)
        id: provision
        uses: ./.github/actions/provision
        with:
          # No `client-secret`: the contract is `workload_identity` — the Action exchanges this job's OIDC token.
          connection: .thoryn/connection.json
          file: .thoryn/provision.yaml
          hub: ${{ inputs.hub }}
          cli-version: ${{ inputs.cli-version }}
          destroy: ${{ inputs.destroy }}

      # SSO-3710 — a red run names its fix: the Action asks the CLI for the fix request (`thoryn-provision-request.json`,
      # the missing rights with the exact commands; written by `login --connection` and `provision plan|apply` through
      # THORYN_FIX_REQUEST) and this uploads it as the artifact the Thoryn GitHub App relays onto a check run. Only a
      # failed job has one; a release predating `--fix-request` writes none and the step finds nothing to upload.
      - name: Upload the fix request
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: thoryn-provision-request
          path: ${{ steps.provision.outputs.fix-request }}
          if-no-files-found: ignore
          retention-days: 7

      # SSO-3113 (epic SSO-3108) — prove the CI identity is CONFINED, not merely that it can do its job.
      # The Action leaves the downloaded thoryn.jar and the signed-in session in the workspace.
      #  1. Reads are confined (ADR 2026-09-15 §8): as the trust's client, `env list` must return exactly the
      #     sandbox this identity manages. A workspace-wide identity would list the production environment too.
      #  2. A foreign environment answers 404 — only meaningful when its EXISTENCE is known, because by
      #     design a foreign environment and a nonexistent one are the same 404 from the CI identity's side. So
      #     the id comes from a dispatch input set by someone who can see it, never a guessed or random id.
      #     This is a GET, not a DELETE: if confinement were ever broken, a destructive probe would
      #     destroy a real environment instead of failing the run.
      - name: Assert the CI identity is confined (SSO-3113)
        env:
          FOREIGN_ENVIRONMENT_ID: ${{ inputs.foreign-environment-id }}
          EXPECTED_SANDBOX: ${{ steps.provision.outputs.environment }}
          # The composite action opts its own steps into the plaintext token store (no OS keychain on a
          # hosted runner, SSO-794); this step reads the same session, so it needs the same opt-in. Run
          # 38549515003 failed here with "OS keychain backend is not available" without it.
          THORYN_CI_PLAINTEXT_TOKENS: "1"
        run: |
          set -euo pipefail
          listed=$(java -jar thoryn.jar env list --output json | jq -r 'if type == "array" then . else .data end | .[] | .slug' | sort)
          echo "Environments visible to the CI identity:"; echo "$listed" | awk '{ print "  " $0 }'
          if [ "$listed" != "$EXPECTED_SANDBOX" ]; then
            echo "::error::confinement broken — expected the CI identity to see only '$EXPECTED_SANDBOX', saw: $(echo "$listed" | tr '\n' ' ')" >&2
            exit 1
          fi
          if [ -z "$FOREIGN_ENVIRONMENT_ID" ]; then
            echo "::notice::no foreign-environment-id supplied — list confinement asserted; foreign GET skipped."
            exit 0
          fi
          set +e
          body=$(java -jar thoryn.jar env get "$FOREIGN_ENVIRONMENT_ID" --output json)
          rc=$?
          set -e
          status=$(echo "$body" | jq -r '.httpStatus // empty' 2>/dev/null || true)
          if [ "$rc" -eq 0 ] || [ "$status" != "404" ]; then
            echo "::error::confinement broken — GET of foreign environment answered rc=$rc httpStatus=${status:-none}, expected 404" >&2
            echo "$body" >&2
            exit 1
          fi
          echo "Foreign environment answered 404 — the CI identity cannot reach it."

      # SSO-3717 (oauthy ADR 2026-10-15 §1, decomposition item 6 — "run, not reasoned") — prove the SCOPE of the
      # teardown, not merely that it ran. The Action's destroy printed `{destroyed, removed[], skipped[]}`; this
      # identity (`client:wi_…`) may remove only what the platform says it OWNS, and the file says `retain: true`
      # on `cli` and the sandbox. So the document must show:
      #   * removed[]  — exactly ONE row: application/loopback-rp in the sandbox (created by this identity ⇒ owned);
      #   * skipped[]  — application/cli and environment/ci, each `retain: true` with the reason
      #                  `retained by the file (`retain: true`) — never removed by destroy / --prune`.
      # A loopback row that was SKIPPED instead (e.g. `… is not OWNED by this identity …`) means a live client this
      # identity did not create — a person created it once; the fix is that person's one-time
      # `thoryn clients delete <id> --environment cli-ci` (the row's `byHand`), after which the next apply creates it
      # as this identity and the destroy removes it. A `cli` or `ci` row in removed[] would mean `retain:` left the
      # file — the one way this workflow could delete the CLI's own login client, so it is a hard failure here.
      - name: Assert destroy removed exactly the per-run loopback client — cli and the sandbox retained (SSO-3717)
        if: inputs.destroy == 'true'
        env:
          DESTROY_RESULT: ${{ steps.provision.outputs.destroy-result }}
          EXPECTED_SANDBOX: ${{ steps.provision.outputs.environment }}
        run: |
          set -euo pipefail
          [ -n "$DESTROY_RESULT" ] && [ -s "$DESTROY_RESULT" ] || { echo "::error::no destroy document — the Action's teardown did not run or printed nothing (destroy-result='$DESTROY_RESULT')." >&2; exit 1; }
          # One shape for both outcomes: `destroy` prints {destroyed, removed[], skipped[]} when it removed something and
          # its plan {changes[]} when it had nothing to remove (every row a skip) — normalise to removed/skipped rows.
          rows="$(jq -c '{removed: (.removed // [.changes[]? | select(.action=="remove")]), skipped: (.skipped // [.changes[]? | select(.action=="skip")])}' "$DESTROY_RESULT")"
          echo "removed: $(echo "$rows" | jq -c '[.removed[] | {kind, name, id, environment}]')"
          echo "skipped: $(echo "$rows" | jq -c '[.skipped[] | {kind, name, retain, reason}]')"
          removed_keys="$(echo "$rows" | jq -r '[.removed[] | "\(.kind)/\(.name)"] | sort | join(" ")')"
          if [ "$removed_keys" != "application/loopback-rp" ]; then
            echo "::error::destroy removed [$removed_keys] — expected exactly application/loopback-rp. A retained resource in this list means retain: left the file; an empty list means the loopback client was not this identity's to remove (see the skipped rows' byHand)." >&2
            echo "$rows" | jq -r '.skipped[] | select(.byHand != null) | "  \(.kind)/\(.name): \(.reason)\n    by hand: \(.byHand)"' >&2
            exit 1
          fi
          loopback_env="$(echo "$rows" | jq -r '.removed[0].environment // ""')"
          if [ "$loopback_env" != "$EXPECTED_SANDBOX" ]; then
            echo "::error::the removed loopback client lives in '$loopback_env', expected the sandbox '$EXPECTED_SANDBOX'." >&2
            exit 1
          fi
          for key in application/cli environment/ci; do
            kind="${key%/*}"; name="${key#*/}"
            row="$(echo "$rows" | jq -c --arg k "$kind" --arg n "$name" '[.skipped[] | select(.kind==$k and .name==$n)] | first // empty')"
            [ -n "$row" ] || { echo "::error::$key is missing from the destroy plan's skipped rows — it must be left in place as a retained resource." >&2; exit 1; }
            if [ "$(echo "$row" | jq -r '.retain // false')" != "true" ] || ! echo "$row" | jq -e '.reason | startswith("retained by the file")' > /dev/null; then
              echo "::error::$key was left in place for the wrong reason — expected retain: true and 'retained by the file …', got: $(echo "$row" | jq -r '.reason')" >&2
              exit 1
            fi
          done
          echo "Destroy scope as declared: application/loopback-rp removed; application/cli and environment/ci retained by the file."

      # Downstream consumers use the Action's outputs. The destroy inside the Action runs on exit, so
      # the loopback client id is only valid for the life of the job (the workspace, the sandbox, `cli` and
      # the issuer persist). Outputs are read through `env:` (never interpolated into the script source —
      # SSO-3635). There is no receipt (SSO-3715): the apply's and the destroy's JSON documents under
      # $RUNNER_TEMP are the run's record, and the platform's audit log the durable one.
      - name: Show provisioned identifiers
        env:
          WORKSPACE_SLUG: ${{ steps.provision.outputs.workspace-slug }}
          ENVIRONMENT: ${{ steps.provision.outputs.environment }}
          CLIENT_ID: ${{ steps.provision.outputs.client-id }}
          ISSUER: ${{ steps.provision.outputs.issuer }}
          APPLY_RESULT: ${{ steps.provision.outputs.apply-result }}
          DESTROY_RESULT: ${{ steps.provision.outputs.destroy-result }}
        run: |
          echo "workspace-slug = $WORKSPACE_SLUG"
          echo "environment    = $ENVIRONMENT"
          echo "client-id      = $CLIENT_ID"
          echo "issuer         = $ISSUER"
          echo "apply-result   = $APPLY_RESULT"
          echo "destroy-result = $DESTROY_RESULT"
