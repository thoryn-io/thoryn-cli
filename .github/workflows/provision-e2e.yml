name: provision-e2e

# SSO-3090 (epic SSO-3087) — demo caller for the reusable provisioning Action
# (.github/actions/provision). thoryn-cli DOGFOODS its own provisioning-as-code: the Action signs in
# from the committed connection contract (`.thoryn/connection.json`, SSO-2951) and converges the
# committed provisioning file (`.thoryn/provision.yaml`) with `thoryn provision apply` (SSO-3088/3089)
# against SHARED STAGING, then `thoryn provision destroy`s it on exit. Real product APIs only.
#
# The ONLY secret this workflow injects is `THORYN_CLI_CI_CLIENT_SECRET` (the env var the contract's
# `auth.secretEnv` names) — the client id, workspace, scopes and the desired resources are all in the
# committed `.thoryn/` files.
#
# The file provisions a SANDBOX environment (`cli-ci`) inside the `thoryn` workspace plus a loopback
# OAuth client in it; destroy hard-deletes the sandbox (cascading the client). A leftover from a failed
# run is ADOPTED by its slug on the next apply, never duplicated (see `.thoryn/provision.yaml`).
#
# Manual only (workflow_dispatch): it mutates a shared-staging workspace and needs the secret, so it
# must not fire on push/PR. Requires a `cli-v*` release carrying `thoryn provision apply`
# (cli-v0.11.0+) — pin one with the cli-version input until it is the latest.
#
# ONE-TIME OPERATOR SETUP (see `.thoryn/README.md` "One-time bootstrap"): a founder mints the CI
# machine client once (`thoryn provision ci-identity`, SSO-2952), pastes its clientId into
# `.thoryn/connection.json`, and sets the `THORYN_CLI_CI_CLIENT_SECRET` repository secret.

on:
  workflow_dispatch:
    inputs:
      hub:
        description: "Hub base URL to provision against (supplied to the CLI as THORYN_HUB)."
        required: false
        default: "https://hub.stg.thoryn.org"
      cli-version:
        description: "cli-v* release tag to run (default: latest). Needs cli-v0.11.0 or newer."
        required: false
        default: ""
      destroy:
        description: "Destroy the provisioned sandbox on exit (\"true\"/\"false\")."
        required: false
        default: "true"

# Serialize: never let two provisioning runs race on the shared workspace (the file's sandbox slug is fixed).
concurrency:
  group: provision-e2e
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  provision:
    runs-on: ubuntu-latest
    steps:
      - name: Check out thoryn-cli (the .thoryn/ files)
        uses: actions/checkout@v4

      - name: Provision as a real customer (sign in from contract + provision apply + destroy)
        id: provision
        uses: ./.github/actions/provision
        with:
          # The ONLY injected secret — the env var the connection contract's auth.secretEnv names.
          client-secret: ${{ secrets.THORYN_CLI_CI_CLIENT_SECRET }}
          hub: ${{ inputs.hub }}
          cli-version: ${{ inputs.cli-version }}
          destroy: ${{ inputs.destroy }}

      # Downstream consumers use the Action's outputs. The destroy inside the Action runs on exit, so
      # the sandbox + client ids are only valid for the life of the job (the workspace + issuer persist).
      - name: Show provisioned identifiers
        run: |
          echo "workspace-slug = ${{ steps.provision.outputs.workspace-slug }}"
          echo "environment    = ${{ steps.provision.outputs.environment }}"
          echo "client-id      = ${{ steps.provision.outputs.client-id }}"
          echo "issuer         = ${{ steps.provision.outputs.issuer }}"
          echo "receipt        = ${{ steps.provision.outputs.receipt }}"
