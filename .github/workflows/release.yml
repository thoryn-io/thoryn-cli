name: release

# Tag-driven release for the thoryn CLI (SSO-2936, epic SSO-2934).
#
# On a `cli-v*` tag it builds and publishes, as GitHub Release assets:
#   * the GraalVM native-image binaries, one per OS/arch — BEST-EFFORT, per
#     runner availability (SSO-2936):
#       thoryn-darwin-arm64  thoryn-darwin-amd64
#       thoryn-linux-amd64   thoryn-linux-arm64
#       thoryn-windows-amd64.exe
#     Each native leg is best-effort: an unavailable/slow/broken platform runner
#     (e.g. the retiring Intel-macOS `macos-13`) is tolerated and simply omitted
#     from the release, rather than failing or blocking it.
#   * the fat jar `thoryn.jar` — ALWAYS published; the SAME asset name the
#     thoryn-examples conformance / example-e2e workflows download
#     (`gh release download ... --pattern 'thoryn.jar'`). Keep that name stable.
#     This is the one required build; the release fails only if the jar is absent.
# and then bumps the in-repo Homebrew formula (Formula/thoryn.rb) to the new
# version + the released binaries' sha256 (only for the binaries that built) and
# commits it back.
#
# Ported from oauthy's .github/workflows/cli-release.yml, with the SSO-2928 fix:
# the original resolved the tag as `${GITHUB_REF_NAME:-inputs.tag}`, so a
# workflow_dispatch run (GITHUB_REF_NAME = the branch `main`) minted a bogus
# `main` release. Here the tag is resolved and VALIDATED to be a `cli-v*` tag —
# a branch name can never become a release (see the `resolve` job).

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing cli-v* tag to (re)build a release for, e.g. cli-v0.1.0"
        required: true

permissions:
  contents: write # create the release, upload assets, push the formula-bump branch
  pull-requests: write # SSO-3120 — the formula bump lands as a PR, not a direct push to main
  actions: write # SSO-3120 — approve the parked `ci` run on the formula PR (fallback: dispatch `ci`)

jobs:
  # ── SSO-2928 fix: resolve the tag from the tag ref (push) or the required
  #    dispatch input, and REFUSE anything that is not a cli-v* tag. There is no
  #    branch fallback, so a `main` release can no longer be minted. ───────────
  resolve:
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
      version: ${{ steps.tag.outputs.version }}
    steps:
      - name: Resolve and validate the release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_TAG: ${{ github.event.inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$REF_NAME"
          fi
          case "$tag" in
            cli-v*) ;;
            *)
              echo "::error::refusing to release from '$tag' — the release tag must match cli-v* (SSO-2928); a branch name is never a release."
              exit 1
              ;;
          esac
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=${tag#cli-v}" >> "$GITHUB_OUTPUT"

  # ── SSO-3120 — the release gate: the tagged tree's own unit suite. ─────────
  #
  # Branch protection makes `ci` (build + unit tests) a REQUIRED check before
  # anything merges to `main` — but a `cli-v*` tag is pushed directly and answers
  # to no protection rule, and every build leg below passes `-DskipTests`. So
  # without this job nothing tests the code between an arbitrary commit and a
  # customer's machine: the release binaries, and the Homebrew formula that
  # `brew upgrade thoryn` follows.
  #
  # This re-runs the suite against the EXACT tagged tree rather than asking the
  # Checks API whether some `ci` run once passed on that sha. That choice is
  # deliberate: a sha query needs no less code, but it cannot see a `push: main`
  # run still in flight when the tag lands, and `ci` sets
  # `concurrency: cancel-in-progress: true`, so a superseded run ends
  # `cancelled` rather than `success` (the SSO-3016 trap — always read the
  # LATEST attempt). Re-running is also the stronger claim: it verifies the tree
  # being released, not that some tree with this sha once passed.
  #
  # ~15s: MockWebServer only, no Testcontainers, no network. `native` and `jar`
  # both gate on it, and `release` re-states the requirement because its own
  # condition is `always()` (it tolerates a failed best-effort native leg, and
  # must not tolerate this).
  verify:
    name: verify the tagged tree
    needs: resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      # Same command `ci` runs on every PR. `${revision}` defaults to
      # 0.0.1-SNAPSHOT (SSO-2953); the version stamp belongs on the packaging
      # legs below, not here — this job exists to run the tests.
      - name: Build and test the tagged tree
        run: ./mvnw -B -ntp verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports-release
          path: target/surefire-reports/
          if-no-files-found: ignore
          retention-days: 7

  # ── GraalVM native-image binaries, one per OS/arch. ────────────────────────
  #
  # BEST-EFFORT (SSO-2936 resilience): every native leg is `continue-on-error`
  # and `fail-fast: false`, so one platform's runner being unavailable, slow, or
  # broken (e.g. GitHub retiring the Intel-macOS `macos-13` runner, which sat
  # `queued` for ~52 min on the first cli-v0.2.0 attempt) can NOT fail or block
  # the whole release. The `release` job does not hard-require this job's success
  # — it publishes whichever binaries actually built plus the always-required
  # `thoryn.jar`. `timeout-minutes` bounds a leg whose build hangs once running.
  native:
    needs: [resolve, verify]
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            asset: thoryn-darwin-arm64
            march: default
          # Intel macOS (thoryn-darwin-amd64) is intentionally NOT in the matrix:
          # GitHub is retiring the `macos-13` runner, so the leg sits `queued` and
          # never starts — and `release` needs `[native]`, so a queued (never-
          # assigned) leg blocks publish until GitHub's unassignable-job timeout
          # (the best-effort tolerance bounds a *running* hang, not a *queued*
          # one). Dropped so releases publish promptly. Re-add
          # `- {os: macos-13, asset: thoryn-darwin-amd64, march: compatibility}`
          # once a working Intel-macOS runner exists; publish + formula already
          # tolerate its presence/absence.
          - os: ubuntu-24.04
            asset: thoryn-linux-amd64
            march: compatibility
          - os: ubuntu-24.04-arm
            asset: thoryn-linux-arm64
            march: default
          - os: windows-2022
            asset: thoryn-windows-amd64.exe
            march: compatibility
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: "21"
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the native image
        shell: bash
        run: |
          set -euo pipefail
          # arm64 GraalVM does not support -march=compatibility; the pom activates
          # the -march flag only when -Dnative-march=compatibility is passed.
          # -Drevision stamps the release version into the binary (SSO-2953) so
          # `thoryn --version` reports the release, not the 0.0.1-SNAPSHOT default.
          if [ "${{ matrix.march }}" = "compatibility" ]; then
            ./mvnw -q -Pnative -Dnative-march=compatibility -Drevision="${{ needs.resolve.outputs.version }}" -DskipTests package
          else
            ./mvnw -q -Pnative -Drevision="${{ needs.resolve.outputs.version }}" -DskipTests package
          fi
      - name: Stage the binary under its release-asset name
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          if [ "${{ runner.os }}" = "Windows" ]; then
            cp target/thoryn.exe "dist/${{ matrix.asset }}"
          else
            cp target/thoryn "dist/${{ matrix.asset }}"
          fi
      # SSO-3147 — code-sign (+ notarize) the macOS binary so its Developer ID code identity is
      # STABLE. That stability is what makes a user's keychain "Always Allow" ACL persist across a
      # `brew upgrade`, so the token store stops re-prompting on every run (a one-time grant, then
      # silent). Secrets-gated and BEST-EFFORT — matching the per-platform tolerance this job already
      # has: with no signing secrets the binary is published UNSIGNED (no failure), and the keychain
      # re-prompt persists until the secrets are configured.
      #
      # Required repo secrets (App Store Connect API-key notarisation):
      #   MACOS_CERT_P12_BASE64   base64 of the Developer ID Application certificate (.p12)
      #   MACOS_CERT_PASSWORD     the .p12 export password
      #   MACOS_SIGN_IDENTITY     e.g. "Developer ID Application: Thoryn ... (TEAMID)"
      #   MACOS_NOTARY_KEY_P8_BASE64 / MACOS_NOTARY_KEY_ID / MACOS_NOTARY_KEY_ISSUER  notarytool API key
      - name: Code-sign and notarize (macOS)
        if: runner.os == 'macOS'
        env:
          BIN: dist/${{ matrix.asset }}
          MACOS_CERT_P12_BASE64: ${{ secrets.MACOS_CERT_P12_BASE64 }}
          MACOS_CERT_PASSWORD: ${{ secrets.MACOS_CERT_PASSWORD }}
          MACOS_SIGN_IDENTITY: ${{ secrets.MACOS_SIGN_IDENTITY }}
          MACOS_NOTARY_KEY_P8_BASE64: ${{ secrets.MACOS_NOTARY_KEY_P8_BASE64 }}
          MACOS_NOTARY_KEY_ID: ${{ secrets.MACOS_NOTARY_KEY_ID }}
          MACOS_NOTARY_KEY_ISSUER: ${{ secrets.MACOS_NOTARY_KEY_ISSUER }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "${MACOS_CERT_P12_BASE64:-}" ] || [ -z "${MACOS_SIGN_IDENTITY:-}" ]; then
            echo "::warning::No macOS signing secrets set — publishing UNSIGNED. The keychain re-prompt (SSO-3147) persists until MACOS_CERT_* / MACOS_SIGN_IDENTITY are configured."
            exit 0
          fi

          # 1) Import the Developer ID Application cert into a throwaway keychain (deleted at the end).
          KEYCHAIN="$RUNNER_TEMP/thoryn-signing.keychain-db"
          KEYCHAIN_PW="$(openssl rand -base64 24)"
          security create-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          security set-keychain-settings -lut 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PW" "$KEYCHAIN"
          echo "$MACOS_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$MACOS_CERT_PASSWORD" -T /usr/bin/codesign
          # Let codesign use the imported key without an interactive prompt on the runner.
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PW" "$KEYCHAIN" >/dev/null
          # Put our keychain first in the user search list so codesign resolves the identity.
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | sed -e 's/"//g')

          # 2) Sign: hardened runtime + secure timestamp. The stable Developer ID designated
          #    requirement is the part that makes the user's keychain "Always Allow" stick.
          codesign --force --options runtime --timestamp --sign "$MACOS_SIGN_IDENTITY" "$BIN"
          codesign --verify --strict --verbose=2 "$BIN"

          # 3) Notarize (App Store Connect API key). A bare Mach-O cannot be stapled, so Gatekeeper
          #    verifies the ticket online on first run; the SIGNATURE is what the keychain fix needs.
          if [ -n "${MACOS_NOTARY_KEY_P8_BASE64:-}" ] && [ -n "${MACOS_NOTARY_KEY_ID:-}" ] && [ -n "${MACOS_NOTARY_KEY_ISSUER:-}" ]; then
            echo "$MACOS_NOTARY_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary.p8"
            ditto -c -k --keepParent "$BIN" "$RUNNER_TEMP/notary.zip"
            xcrun notarytool submit "$RUNNER_TEMP/notary.zip" \
              --key "$RUNNER_TEMP/notary.p8" --key-id "$MACOS_NOTARY_KEY_ID" --issuer "$MACOS_NOTARY_KEY_ISSUER" \
              --wait --timeout 20m
          else
            echo "::warning::Signed but NOT notarized (no MACOS_NOTARY_* secrets). Gatekeeper may warn on first run; the keychain fix only needs the signature."
          fi

          # 4) Tear down the throwaway keychain + decoded secrets.
          security delete-keychain "$KEYCHAIN" || true
          rm -f "$RUNNER_TEMP/cert.p12" "$RUNNER_TEMP/notary.p8" "$RUNNER_TEMP/notary.zip" || true
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: dist/${{ matrix.asset }}
          if-no-files-found: error

  # ── Fat jar — the stable `thoryn.jar` asset the examples CI consumes. ──────
  jar:
    needs: [resolve, verify]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.resolve.outputs.tag }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build the thoryn CLI fat jar
        # -Drevision stamps the release version into the jar (SSO-2953) so
        # `java -jar thoryn.jar --version` reports the release version.
        run: ./mvnw -q -Drevision="${{ needs.resolve.outputs.version }}" -DskipTests package
      - uses: actions/upload-artifact@v4
        with:
          name: thoryn.jar
          path: target/thoryn.jar
          if-no-files-found: error

  # ── Publish the release + bump the Homebrew formula. ───────────────────────
  #
  # Requires resolve + verify + jar to succeed — `verify` is the SSO-3120 release
  # gate (the tagged tree's unit suite) and `jar` is the asset thoryn-examples CI
  # consumes, so both are non-negotiable. It does NOT require `native` to succeed:
  # `if: always()` lets publish proceed once the native matrix has SETTLED to any
  # terminal state, and it uploads whichever native binaries actually built. A
  # platform that failed / was skipped / never produced an artifact is simply
  # absent from the release, not a release-blocking failure.
  release:
    needs: [resolve, verify, native, jar]
    if: ${{ always() && needs.resolve.result == 'success' && needs.verify.result == 'success' && needs.jar.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      # Check out the DEFAULT branch (not the tag) so the formula bump commit
      # lands on main rather than on a detached tag ref.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Download all release assets
        uses: actions/download-artifact@v4
        with:
          path: assets
          merge-multiple: true
      - name: List downloaded assets
        run: ls -la assets
      - name: Create the GitHub Release and upload assets
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          # The jar is the consumed asset and is always required.
          if [ ! -f assets/thoryn.jar ]; then
            echo "::error::assets/thoryn.jar is missing — the jar build is required and must not be absent."
            exit 1
          fi
          # Publish WHATEVER native binaries actually built. A best-effort leg
          # that failed / was skipped / never got a runner uploaded no artifact,
          # so its file is simply absent from assets/ — skip it, don't fail.
          files=(assets/thoryn.jar)
          for asset in \
            thoryn-darwin-arm64 \
            thoryn-darwin-amd64 \
            thoryn-linux-amd64 \
            thoryn-linux-arm64 \
            thoryn-windows-amd64.exe; do
            if [ -f "assets/$asset" ]; then
              files+=("assets/$asset")
            else
              echo "::warning::native asset '$asset' was not produced — omitting it from the release (best-effort per runner availability)."
            fi
          done
          echo "Publishing ${#files[@]} asset(s): ${files[*]}"
          gh release create "$TAG" \
            "${files[@]}" \
            --repo "${{ github.repository }}" \
            --title "thoryn CLI $TAG" \
            --notes "The \`thoryn\` customer-plane CLI.

          Native binaries (per OS/arch) and the \`thoryn.jar\` fat jar (run with \`java -jar thoryn.jar\`) are attached below.
          Native binaries are best-effort per runner availability — the \`thoryn.jar\` is always published; a given platform's binary may be absent if its runner was unavailable at build time.

          Homebrew:

              brew tap thoryn-io/thoryn-cli
              brew install thoryn"

      # ── SSO-3120 — the formula bump lands as a PR, AFTER the release exists. ──
      #
      # This used to `git push origin HEAD:main` directly. Once `main` gained the
      # required `build + unit tests` check, GitHub rejected that push outright:
      #
      #   remote: error: GH006: Protected branch update failed for refs/heads/main.
      #   remote: - Required status check "build + unit tests" is expected.
      #
      # and because the push ran BEFORE `gh release create`, the whole job exited 1
      # with the binaries built and NO release published. Found by a workflow_dispatch
      # re-drive of cli-v0.15.0 (run 35062971615) rather than by the next real tag.
      #
      # Two changes, both deliberate:
      #  1. Publishing now happens FIRST, so the customer-facing artifact is never
      #     hostage to a formula bump. A failure here leaves the release out and the
      #     formula stale — visible and recoverable, not a missing release.
      #  2. The bump goes through a PR, so `main` keeps its gate. Weakening the
      #     protection (or granting the bot a ruleset bypass) would have been the
      #     other route; keeping the branch protected is worth one merge click.
      #
      # Auto-merge (product owner, 2026-09-16; repo "Allow auto-merge" is on). The PR still passes the
      # required `build + unit tests` check like any other. A PR opened with GITHUB_TOKEN gets its
      # `pull_request` ci run PARKED as action_required, so this step approves that run (see below);
      # auto-merge then lands the PR once it is green.
      - name: Bump the Homebrew formula
        run: bash scripts/release/bump-formula.sh "${{ needs.resolve.outputs.version }}" assets
      - name: Open a PR for the bumped formula
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.resolve.outputs.tag }}
        run: |
          set -euo pipefail
          if git diff --quiet -- Formula/thoryn.rb; then
            echo "Formula/thoryn.rb already up to date — nothing to open a PR for."
            exit 0
          fi
          branch="ci/formula-bump-${TAG}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add Formula/thoryn.rb
          git commit -m "ci(release): SSO-2936 bump Homebrew formula to ${TAG}"
          # A re-drive of the same tag reuses the branch name; force is safe because
          # the branch is machine-owned and carries exactly this one commit.
          git push --force origin "$branch"
          if gh pr view "$branch" --repo "${{ github.repository }}" --json state -q .state 2>/dev/null | grep -q OPEN; then
            echo "PR for $branch already open — the force-push updated it."
          else
            gh pr create \
              --repo "${{ github.repository }}" \
              --base "${{ github.event.repository.default_branch }}" \
              --head "$branch" \
              --title "ci(release): SSO-2936 bump Homebrew formula to ${TAG}" \
              --body "Automated by \`release.yml\` after publishing [\`${TAG}\`](https://github.com/${{ github.repository }}/releases/tag/${TAG}).

          \`brew upgrade thoryn\` follows this formula, so the release is not reachable by Homebrew users until this merges."
          fi
          # Queue auto-merge first; it lands the PR the moment the required check is green.
          gh pr merge "$branch" --repo "${{ github.repository }}" --auto --squash

          # SSO-3120 — get the REQUIRED check to run on the PR itself. Observed on cli-v0.17.0: opening
          # this PR with GITHUB_TOKEN does start a `pull_request` run of `ci`, but GitHub parks it as
          # `action_required` (bot-authored PR awaiting approval). A separately dispatched `ci` run on the
          # same sha went green, yet the PR stayed BLOCKED — the parked PR run is what protection waits on.
          # So approve the parked run (POST /actions/runs/{id}/approve, needs `actions: write`) instead of
          # dispatching a parallel one. Fallback: if no parked run appears or approval is refused, dispatch
          # `ci` and print the exact manual command, so a stuck formula PR is loud rather than silent.
          sha=$(git rev-parse HEAD)
          run_id=""
          for _ in $(seq 1 24); do
            run_id=$(gh api "repos/${{ github.repository }}/actions/runs?event=pull_request&head_sha=${sha}" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")
                     | select(.status == "action_required" or .conclusion == "action_required")][0].id // empty')
            [ -n "$run_id" ] && break
            ok=$(gh api "repos/${{ github.repository }}/actions/runs?event=pull_request&head_sha=${sha}" \
              --jq '[.workflow_runs[] | select(.path == ".github/workflows/ci.yml")][0].id // empty')
            if [ -n "$ok" ]; then
              echo "ci already running on the formula PR (run $ok) — no approval needed."
              exit 0
            fi
            sleep 5
          done
          if [ -n "$run_id" ] && gh api -X POST "repos/${{ github.repository }}/actions/runs/${run_id}/approve" >/dev/null; then
            echo "Formula PR for $TAG: approved parked ci run $run_id on $branch; auto-merge queued."
          else
            echo "::warning::could not approve a parked ci run for $branch (run='${run_id:-none}') — dispatching ci instead. If the PR stays BLOCKED, run: gh api -X POST repos/${{ github.repository }}/actions/runs/<parked-run-id>/approve"
            gh workflow run ci.yml --repo "${{ github.repository }}" --ref "$branch"
          fi
