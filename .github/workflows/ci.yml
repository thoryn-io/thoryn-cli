name: ci

# SSO-3120 — PR + main build/test gate for the thoryn CLI.
#
# thoryn-cli is a PUBLIC repo whose `cli-v*` tags publish release binaries and bump
# the Homebrew formula `brew upgrade thoryn` follows — the path from `main` to a
# customer's machine is a single tag push. Before this workflow there was NO CI on
# pull_request or push:main (only the tag-driven release.yml and the dispatch-only
# provision-e2e.yml), so the ~458 unit tests ran only when a human remembered
# `mvn test` locally. SSO-3119 is the concrete miss that motivated this: an ordering
# defect + FakeProductApi fictions rode `main` through two releases.
#
# This runs the module build AND the full unit suite (`./mvnw verify` = compile +
# test + package the fat jar) on every PR and every push to main. It is fast (~15s,
# MockWebServer only — no Testcontainers / no network) and is intended to be a
# REQUIRED status check on main (set in branch protection; see SSO-3120).

on:
  pull_request:
  push:
    branches: [main]
  # SSO-3120 — lets release.yml start this check on its own formula-bump PR. A PR opened with the
  # workflow's GITHUB_TOKEN does NOT trigger `pull_request` workflows (GitHub suppresses recursive
  # runs), so without a dispatch the required `build + unit tests` check would never report on it and
  # the PR could never merge — by hand or by auto-merge. `workflow_dispatch` is the one event
  # GITHUB_TOKEN is allowed to trigger, and its check run lands on the dispatched ref's head sha,
  # which is what branch protection matches.
  workflow_dispatch:

# One in-flight run per ref; a new push supersedes the previous run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build-test:
    name: build + unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      # compile + run the full unit suite + package the fat jar. `${revision}`
      # defaults to 0.0.1-SNAPSHOT (SSO-2953), so no version flag is needed here;
      # the release workflow is the only place that pins a real -Drevision.
      - name: Build and test
        run: ./mvnw -B -ntp verify

      # Surefire/HTML reports for triaging a red run without re-running locally.
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: '**/target/surefire-reports/'
          if-no-files-found: ignore
          retention-days: 7

  # SSO-3308 — secret-less sign-in against SHARED STAGING, exercising the CLI built from THIS commit:
  # the job exchanges its own GitHub Actions OIDC token under a workload identity trust (no stored
  # secret anywhere) and runs a harmless read. The trust is a real product resource the product owner
  # creates ONCE with `thoryn workload-identity trusts create` (never seeded); its client id and audience
  # are repository VARIABLES (public identifiers, not secrets):
  #   THORYN_WIF_CLIENT_ID  — the trust's clientId (wi_…)
  #   THORYN_WIF_AUDIENCE   — the trust's audience, exactly
  # Until both are set this skips with a notice, so the check never blocks a PR for want of the fixture.
  # It never runs for a fork PR (GitHub grants no id-token there).
  workload-identity-gate:
    name: workload identity (staging) — configured?
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    steps:
      - id: check
        env:
          WIF_CLIENT_ID: ${{ vars.THORYN_WIF_CLIENT_ID }}
          WIF_AUDIENCE: ${{ vars.THORYN_WIF_AUDIENCE }}
          SAME_REPO: ${{ github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          if [ "$SAME_REPO" != "true" ]; then
            echo "::notice::workload identity staging check skipped — a pull request from a fork cannot request an OIDC token."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          elif [ -z "${WIF_CLIENT_ID:-}" ] || [ -z "${WIF_AUDIENCE:-}" ]; then
            echo "::notice::workload identity staging check skipped — set the repository variables THORYN_WIF_CLIENT_ID and THORYN_WIF_AUDIENCE (see the one-time setup in .thoryn/README.md, 'Workload identity')."
            echo "configured=false" >> "$GITHUB_OUTPUT"
          else
            echo "configured=true" >> "$GITHUB_OUTPUT"
          fi

  workload-identity-staging:
    name: workload identity sign-in (staging)
    needs: workload-identity-gate
    if: needs.workload-identity-gate.outputs.configured == 'true'
    runs-on: ubuntu-latest
    # The trust pins this GitHub environment, so the job's `sub` is the same for a PR and for main.
    environment: thoryn-staging-wif
    permissions:
      contents: read
      id-token: write # lets the job request its own OIDC token — the ONLY credential this job has
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Build the CLI from this commit
        run: ./mvnw -B -ntp -DskipTests package

      - name: Sign in with workload identity (no secret) and read
        env:
          WIF_CLIENT_ID: ${{ vars.THORYN_WIF_CLIENT_ID }}
          WIF_AUDIENCE: ${{ vars.THORYN_WIF_AUDIENCE }}
          # Headless runner: no OS keychain; the documented CI opt-in for the chmod-0600 file store.
          THORYN_CI_PLAINTEXT_TOKENS: "1"
        run: |
          set -euo pipefail
          thoryn() { java -jar cli/target/thoryn.jar "$@"; }
          thoryn login --workload-identity --client-id "$WIF_CLIENT_ID" --audience "$WIF_AUDIENCE" --scope tenant:environments.read
          thoryn login --status
          # A harmless read through the gateway with the exchanged token.
          thoryn env list --output json > /dev/null
          echo "env list answered with the workload identity token."
          # A job token works once: signing in again must request a FRESH one and succeed.
          thoryn login --workload-identity --client-id "$WIF_CLIENT_ID" --audience "$WIF_AUDIENCE" --scope tenant:environments.read
          thoryn logout || true

  # SSO-3687 — the container image ghcr.io/thoryn-io/thoryn-cli, built from THIS commit and run, with
  # nothing pushed. release.yml publishes it from the linux native binaries; this builds the same
  # binary the same way on the same runner class (ubuntu-24.04 / ubuntu-24.04-arm, -march as there),
  # puts it on the same pinned distroless base through the same Dockerfile, and runs it. It catches a
  # binary that cannot start on the base (a shared library the base lacks — the libz.so.1 trap — or a
  # newer glibc than Debian 12 carries), a Dockerfile regression, and a lost non-root user — at PR
  # time, not after a tag. Not a required check (a native build takes minutes); the release re-runs
  # the same smoke before it pushes.
  container-image:
    name: container image (${{ matrix.arch }}) — build + smoke
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
            march: compatibility
          - arch: arm64
            runner: ubuntu-24.04-arm
            march: default
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: graalvm/setup-graalvm@27b360dbb857524eaf0b4c4cef364d38e5b4f173 # v1.6.7
        with:
          java-version: "21"
          distribution: graalvm
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Ensure libz.a for the static zlib link
        run: dpkg -s zlib1g-dev >/dev/null 2>&1 || { sudo apt-get update -qq && sudo apt-get install -y -qq zlib1g-dev; }

      - name: Build the linux native binary (as release.yml does)
        env:
          MARCH: ${{ matrix.march }}
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          if [ "$MARCH" = "compatibility" ]; then
            ./mvnw -B -ntp -q -Pnative -Dnative-march=compatibility -Drevision=0.0.0-ci -DskipTests package
          else
            ./mvnw -B -ntp -q -Pnative -Drevision=0.0.0-ci -DskipTests package
          fi
          mkdir -p dist
          cp cli/target/thoryn "dist/thoryn-linux-$ARCH"
          # Evidence for the base-image choice, in the log: glibc is the ONLY shared dependency.
          # (Captured first, not `| grep -q` — under pipefail an early-exiting grep could SIGPIPE
          # readelf and turn a hit into a silent pass.)
          needed="$(readelf -d "dist/thoryn-linux-$ARCH" | grep NEEDED)"
          echo "$needed"
          extra="$(grep -v -e 'libc\.so\.6' -e 'ld-linux' <<< "$needed" || true)"
          if [ -n "$extra" ]; then
            echo "::error::the linux binary needs a shared library besides glibc — distroless/cc will not carry it (see cli/pom.xml native-static-nolibc-linux): $extra"
            exit 1
          fi

      - name: Build the image (no push) and run it as the init container does
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          set -euo pipefail
          docker build --platform "linux/$ARCH" -t "thoryn-cli:ci-$ARCH" .
          bash scripts/release/smoke-image.sh "thoryn-cli:ci-$ARCH" 0.0.0-ci
