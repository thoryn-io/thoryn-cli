# SSO-2951 (epic SSO-2947) — reusable "provision-as-a-real-customer" composite Action,
# now bound to the CLI's CONNECTION CONTRACT (`.thoryn/connection.json`).
#
# Configures the Thoryn product against SHARED STAGING using ONLY the real product
# APIs, exercised through the `thoryn` CLI + a signed recipe. There is NO DB seeding,
# no bespoke endpoint, no demo shortcut — the product-boundary rule (CLAUDE.md) applied
# to CI: every resource is created through the same customer-plane workflow a real
# tenant admin would use.
#
# AUTHENTICATION IS AS-CODE (SSO-2951, superseding the SSO-2944 imperative bash sign-in).
# The binding — which workspace, which client, which scopes — lives in the committed
# connection contract `.thoryn/connection.json` (schema: connection.schema.json, SSO-2948),
# NOT in bash `sed` + workflow inputs. Sign-in collapses to one declarative step:
#
#     thoryn login --connection .thoryn/connection.json
#
# The CLI derives the per-tenant issuer (`https://<slug>.hub.<env>`), the gateway, and
# the requested scopes FROM the contract; it reads the client secret from the env var the
# contract NAMES (`auth.secretEnv` = THORYN_CLI_CI_CLIENT_SECRET), failing closed if unset.
# The only injected secret is that one env var — never an argv flag, never echoed.
#
# The machine client the contract names is minted ONCE by a founder via the customer plane
# (`thoryn provision ci-identity`, SSO-2952); the operator pastes its clientId into the
# contract and sets the THORYN_CLI_CI_CLIENT_SECRET GitHub secret. See `.thoryn/README.md`.
#
# What it does, end to end:
#   1. Downloads the prebuilt `thoryn.jar` from the LATEST `cli-v*` release of
#      thoryn-io/thoryn-cli (`gh release download <tag> --pattern thoryn.jar --dir .` ->
#      `./thoryn.jar`). Releases now exist (SSO-2936 stood up the release workflow and
#      cli-v* tags are cut), so CI validates the actually-shipped artifact instead of
#      rebuilding from source — faster, and it exercises exactly what customers get.
#   2. Signs in NON-INTERACTIVELY from the connection contract:
#      `thoryn login --connection <file>`. The secret is supplied as the env var the
#      contract names (THORYN_CLI_CI_CLIENT_SECRET); the hub base is supplied as the env
#      var the contract names for it (THORYN_HUB). Issuer/gateway/scope are derived by the
#      CLI and stamped onto the session (SSO-2827), so later `examples` commands need no
#      host flags.
#   3. Provisions by APPLYING the WORKSPACE-LESS recipe:
#      `thoryn examples apply <recipe> --set workspaceSlug=<contract slug> --yes`. The
#      standing workspace is the contract's `workspace.slug` (single-sourced — read from
#      the contract, not a separate input). The bundled `ci-signin` recipe registers a
#      public loopback OAuth client UNDER that workspace using the caller's tenant-scoped
#      bearer — no hub.createWorkspace, no token-exchange.
#   4. Exposes the workspace slug / ephemeral client id / per-tenant issuer as Action
#      outputs (read from the run's receipt) for downstream steps.
#   5. TEARS DOWN in an `if: always()` step: `thoryn examples teardown <recipe>` runs the
#      recipe's teardown — which deletes ONLY the ephemeral OAuth client. The standing
#      workspace and standing user are the operator's and are never touched. Guaranteed on
#      failure so a broken run never leaks an ephemeral client.
#
# Scope: the CLI jar is DOWNLOADED from the release (no longer built from the checked-out
# source), but the caller must still `actions/checkout` thoryn-cli before `uses:`-ing it —
# the Action reads the committed connection contract `.thoryn/connection.json` and is itself
# a local composite Action in this repo (the demo caller `.github/workflows/provision-e2e.yml`
# checks out first). Making it consumable from a foreign repo is a follow-up.

name: "Provision Thoryn (as a real customer)"
description: >-
  Download the latest released thoryn CLI jar, sign in from the committed connection contract
  (.thoryn/connection.json), provision an ephemeral OAuth client inside the contract's workspace via a
  signed recipe, expose its ids as outputs, and delete the ephemeral client on exit. Product APIs only
  — no DB seeding, no demo endpoints, no imperative sign-in.

inputs:
  client-secret:
    description: >-
      The client SECRET of the machine client named by the connection contract's `auth.clientId`.
      Pass `secrets.THORYN_CLI_CI_CLIENT_SECRET`. NEVER a literal — the repo is public. Supplied to the
      CLI as the THORYN_CLI_CI_CLIENT_SECRET env var (the name the contract's `auth.secretEnv` declares);
      never echoed, never an argv flag. See `.thoryn/README.md` for the one-time bootstrap that mints it.
    required: true
  connection:
    description: "Path to the connection contract the CLI signs in from (schema: connection.schema.json)."
    required: false
    default: ".thoryn/connection.json"
  hub:
    description: >-
      Hub BASE URL to provision against (the staging broker). Supplied to the CLI as the THORYN_HUB env
      var — the name the contract's `workspace.hubBaseUrlEnv` declares — from which the CLI derives the
      per-tenant issuer `https://<slug>.hub.<env>` and the shared `api.<env>` gateway.
    required: false
    default: "https://hub.stg.thoryn.org"
  recipe:
    description: "The bundled workspace-less recipe to apply. `ci-signin` provisions an ephemeral app in the contract's workspace."
    required: false
    default: "ci-signin"
  environment:
    description: >-
      Optional target environment slug within the contract's workspace (e.g. a sandbox). EMPTY (the
      default) omits `--environment`, so resources go to the workspace's default (production) plane.
    required: false
    default: ""
  java-version:
    description: "Temurin JDK version used to run the released CLI jar."
    required: false
    default: "21"

outputs:
  workspace-slug:
    description: "Slug of the workspace the ephemeral client was created in (the connection contract's workspace.slug)."
    value: ${{ steps.apply.outputs.workspace-slug }}
  client-id:
    description: "Client id of the ephemeral OAuth application the recipe registered."
    value: ${{ steps.apply.outputs.client-id }}
  issuer:
    description: "Per-tenant OIDC issuer for the workspace (https://<slug>.hub.<env>)."
    value: ${{ steps.apply.outputs.issuer }}

runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }} (Temurin)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    # Download the prebuilt `thoryn.jar` from the LATEST `cli-v*` release of this repo,
    # rather than rebuilding from source: faster CI, and it validates the actually-shipped
    # artifact. The release workflow publishes the fat jar under the stable asset name
    # `thoryn.jar` on every `cli-v*` tag; `--dir .` lands it at `./thoryn.jar`. `github.token`
    # is sufficient — this is a same-repo release read.
    - name: Download the released thoryn CLI (latest cli-v* release)
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        tag="$(gh release list --repo thoryn-io/thoryn-cli --limit 40 --json tagName -q '.[].tagName' | grep '^cli-v' | head -1)"
        if [ -z "$tag" ]; then
          echo "::error::no cli-v* release found in thoryn-io/thoryn-cli — run its release workflow (SSO-2936) first." >&2
          exit 1
        fi
        echo "Using CLI release $tag"
        gh release download "$tag" --repo thoryn-io/thoryn-cli --pattern 'thoryn.jar' --dir .
        test -f thoryn.jar
        echo "Downloaded thoryn.jar ($(du -h thoryn.jar | cut -f1)) from release $tag."

    # Sign in from the connection contract. The CLI derives the per-tenant issuer, the gateway and the
    # requested scopes from the contract (workspace.slug + THORYN_HUB), reads the secret from the env
    # var the contract names, and stamps issuer + gateway onto the session (SSO-2827) so the later
    # `examples` commands need no host flags. This one step replaces the former ~20-line bash block that
    # `sed`-derived the issuer/gateway and ran a manual `login --client-credentials --issuer … --scope …`.
    - name: Sign in (connection contract)
      shell: bash
      env:
        # The secret the contract's `auth.secretEnv` names. Read from the env by the CLI; never argv.
        THORYN_CLI_CI_CLIENT_SECRET: ${{ inputs.client-secret }}
        # The hub base the contract's `workspace.hubBaseUrlEnv` names; the CLI derives the issuer/gateway.
        THORYN_HUB: ${{ inputs.hub }}
        CONNECTION: ${{ inputs.connection }}
        # Headless GitHub runners have no OS keychain (Secret Service / D-Bus), so the CLI's default
        # KeychainTokenStore is unavailable. This is the documented CI opt-in for the plaintext file
        # token store (chmod-0600 JSON under $HOME). The token lives only on the ephemeral runner.
        THORYN_CI_PLAINTEXT_TOKENS: "1"
      run: |
        set -euo pipefail
        if [ -z "${THORYN_CLI_CI_CLIENT_SECRET:-}" ]; then
          echo "::error::client-secret is empty — pass secrets.THORYN_CLI_CI_CLIENT_SECRET as the action's client-secret input." >&2
          exit 1
        fi
        if [ ! -f "$CONNECTION" ]; then
          echo "::error::connection contract '$CONNECTION' not found — commit .thoryn/connection.json or pass the connection input." >&2
          exit 1
        fi
        echo "Signing in from connection contract $CONNECTION (hub base $THORYN_HUB)."
        java -jar thoryn.jar login --connection "$CONNECTION"
        java -jar thoryn.jar login --status

    # Provision via the workspace-less recipe, then read the run's receipt to expose ids as outputs.
    # The standing workspace is the contract's `workspace.slug` (single-sourced — read from the contract
    # with jq, not a separate input); `--yes` skips the confirmation. `--environment` is added only when
    # a non-empty environment input is supplied.
    - name: Provision (apply recipe) and expose outputs
      id: apply
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        HUB: ${{ inputs.hub }}
        CONNECTION: ${{ inputs.connection }}
        ENVIRONMENT: ${{ inputs.environment }}
        THORYN_CI_PLAINTEXT_TOKENS: "1"
      run: |
        set -euo pipefail
        # The workspace is the contract's — the single source of the binding.
        slug="$(jq -r '.workspace.slug // ""' "$CONNECTION")"
        if [ -z "$slug" ]; then
          echo "::error::connection contract '$CONNECTION' has no workspace.slug." >&2
          exit 1
        fi

        apply_args=(examples apply "$RECIPE" --set "workspaceSlug=${slug}" --yes)
        if [ -n "${ENVIRONMENT:-}" ]; then
          apply_args+=(--environment "$ENVIRONMENT")
        fi
        java -jar thoryn.jar "${apply_args[@]}"

        # The receipt is the portable, secret-free record of what was provisioned.
        java -jar thoryn.jar examples receipt "$RECIPE" --output json > receipt.json
        echo "----- receipt -----"
        cat receipt.json
        echo "-------------------"

        receipt_slug="$(jq -r '.workspace.slug // ""' receipt.json)"
        [ -n "$receipt_slug" ] || receipt_slug="$slug"
        client="$(jq -r '[.resources[] | select(.kind=="application") | .id] | first // ""' receipt.json)"

        # Per-tenant issuer: hub.<env> -> <slug>.hub.<env> (mirrors ThorynConfig.tenantIssuer).
        tenant_issuer="$HUB"
        if [ -n "$receipt_slug" ]; then
          tenant_issuer="$(printf '%s' "$HUB" | sed -E "s#://hub\.#://${receipt_slug}.hub.#")"
        fi

        {
          echo "workspace-slug=$receipt_slug"
          echo "client-id=$client"
          echo "issuer=$tenant_issuer"
        } >> "$GITHUB_OUTPUT"

        echo "Provisioned ephemeral client '$client' in workspace '$receipt_slug' (issuer $tenant_issuer)."

    # MANDATORY teardown — runs even when a previous step failed, so a failed run never
    # leaks an ephemeral OAuth client. The recipe teardown deletes ONLY the client; the
    # standing workspace and standing user are untouched. Teardown reads the local run
    # state written by `apply`, so it needs no ids passed in; it is a no-op (best-effort)
    # if `apply` never ran.
    - name: Teardown (delete the ephemeral client)
      if: always()
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        THORYN_CI_PLAINTEXT_TOKENS: "1"
      run: |
        set -euo pipefail
        java -jar thoryn.jar examples teardown "$RECIPE" || {
          echo "::warning::teardown reported an error — verify no '${RECIPE}' client leaked in the standing workspace." >&2
          exit 0
        }
