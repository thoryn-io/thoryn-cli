# SSO-2944 (epic SSO-2934) — reusable "provision-as-a-real-customer" composite Action.
#
# Configures the Thoryn product against SHARED STAGING using ONLY the real product
# APIs, exercised through the `thoryn` CLI + a signed recipe. There is NO DB seeding,
# no bespoke endpoint, no demo shortcut — the product-boundary rule (CLAUDE.md) applied
# to CI: every resource is created through the same customer-plane workflow a real
# tenant admin would use.
#
# THE PIVOT (SSO-2944, superseding the SSO-2938 first cut): CI authenticates with a
# CUSTOMER-PLANE `client_credentials` API key that the operator mints THEMSELVES (not a
# seeded platform client). Such a key is TENANT-SCOPED — bound to one workspace via its
# `tnt` claim — and CANNOT create workspaces (workspace-create needs a machine scope a
# tenant admin can't delegate; the SSO-2943 gap). So this Action no longer creates a
# fresh workspace per run. Instead it provisions an EPHEMERAL app inside a STANDING
# workspace the operator owns (the one the API key is scoped to), and deletes only that
# app on exit. The standing workspace + a standing test user are one-time operator setup
# (see the repo README's "CI provisioning setup" section).
#
# What it does, end to end:
#   1. Builds the CLI from source in the runner (`./mvnw -q -DskipTests package` ->
#      `target/thoryn.jar`). We build from source because no `cli-v*` release has been
#      cut yet (SSO-2936 stood up the release workflow but no tag exists). Once a
#      release exists this can switch to a `gh release download --pattern thoryn.jar`
#      — see the commented block in the "Build the thoryn CLI" step below.
#   2. Signs in NON-INTERACTIVELY with a client-credentials API key (SSO-2941):
#      `thoryn login --client-credentials --issuer <hub>`, credential supplied as
#      THORYN_API_KEY=<client-id>:<client-secret> via `inputs.api-key` (never echoed,
#      never an argv flag). The `--issuer` is stamped onto the session so the later
#      `examples` commands target staging automatically (SSO-2827).
#   3. Provisions by APPLYING the WORKSPACE-LESS recipe:
#      `thoryn examples apply ci-signin --set workspaceSlug=<standing-slug> --yes`. The
#      bundled `ci-signin` recipe registers a public loopback OAuth client UNDER the
#      standing workspace (applications.create + applications.get verify) using the
#      caller's own tenant-scoped bearer — no hub.createWorkspace, no token-exchange.
#   4. Exposes the standing workspace slug / ephemeral client id / per-tenant issuer as
#      Action outputs (read from the run's receipt) for downstream steps (e.g. driving
#      a sign-in with the STANDING test user).
#   5. TEARS DOWN in an `if: always()` step: `thoryn examples teardown ci-signin` runs
#      the recipe's teardown — which now deletes ONLY the ephemeral OAuth client. The
#      standing workspace and standing user are the operator's and are never touched.
#      Guaranteed on failure so a broken run never leaks an ephemeral client.
#
# Scope: this Action builds the CLI from the CHECKED-OUT copy of THIS repo, so the
# caller must `actions/checkout` thoryn-cli before `uses:`-ing it (the demo caller
# `.github/workflows/provision-e2e.yml` does). Making it consumable from a foreign
# repo (checkout thoryn-cli internally, or download a released jar) is a follow-up.

name: "Provision Thoryn (as a real customer)"
description: >-
  Build the thoryn CLI from source, sign in with a tenant-scoped client-credentials API key,
  provision an ephemeral OAuth client inside a STANDING workspace via a signed recipe, expose its ids
  as outputs, and delete the ephemeral client on exit. Product APIs only — no DB seeding, no demo
  endpoints, no workspace create (the API key can't).

inputs:
  api-key:
    description: >-
      The CUSTOMER-PLANE client-credentials API key, in the form <client-id>:<client-secret>. It is
      TENANT-SCOPED to the standing workspace named by `workspace-slug` and needs the
      `tenant:applications.write` + `tenant:applications.read` scopes. Pass `secrets.THORYN_API_KEY`.
      NEVER a literal — the repo is public. Supplied to the CLI as the THORYN_API_KEY env var; never
      echoed, never an argv flag. See the repo README's "CI provisioning setup" for how to mint it.
    required: true
  workspace-slug:
    description: >-
      Slug of the STANDING workspace the run provisions into — the workspace the API key is scoped to
      (its `tnt`). This workspace is NOT created and NOT deleted; only an ephemeral OAuth client is
      created inside it and removed on exit.
    required: true
  issuer:
    description: "Hub issuer URL to sign in / provision against (the staging broker)."
    required: false
    default: "https://hub.stg.thoryn.org"
  recipe:
    description: "The bundled workspace-less recipe to apply. `ci-signin` provisions an ephemeral app in the standing workspace."
    required: false
    default: "ci-signin"
  environment:
    description: >-
      Optional target environment slug within the standing workspace (e.g. a sandbox). EMPTY (the
      default) omits `--environment`, so resources go to the workspace's default (production) plane.
    required: false
    default: ""
  scope:
    description: >-
      OAuth scope to request at sign-in. EMPTY (the default) omits the `scope` parameter, so the hub
      mints the client-credentials token with the API key's FULL registered scope set (whatever the
      operator granted it — must include tenant:applications.write + tenant:applications.read). Pin an
      explicit space-separated set only if you need to narrow it.
    required: false
    default: ""
  java-version:
    description: "Temurin JDK version used to build the CLI fat jar."
    required: false
    default: "21"

outputs:
  workspace-slug:
    description: "Slug of the standing workspace the ephemeral client was created in (echoes the input)."
    value: ${{ steps.apply.outputs.workspace-slug }}
  client-id:
    description: "Client id of the ephemeral OAuth application the recipe registered."
    value: ${{ steps.apply.outputs.client-id }}
  issuer:
    description: "Per-tenant OIDC issuer for the standing workspace (https://<slug>.hub.<env>)."
    value: ${{ steps.apply.outputs.issuer }}

runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }} (Temurin)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}
        cache: maven

    # Build the CLI from source. No `cli-v*` release is cut yet, so we cannot
    # `gh release download` a jar. Once SSO-2936 cuts one, this step can become:
    #
    #   gh release download --repo thoryn-io/thoryn-cli --pattern 'thoryn.jar' \
    #     --dir "$GITHUB_WORKSPACE/target"
    #
    # (the release publishes `thoryn.jar` under that stable asset name), dropping
    # the JDK + Maven build entirely. Until then, build the same fat jar the
    # release workflow's `jar` job builds.
    - name: Build the thoryn CLI (fat jar from source)
      shell: bash
      run: |
        set -euo pipefail
        ./mvnw -q -DskipTests package
        test -f target/thoryn.jar
        echo "Built target/thoryn.jar ($(du -h target/thoryn.jar | cut -f1))."

    # Non-interactive client-credentials sign-in. THORYN_API_KEY carries BOTH halves
    # of the credential; it is read from the env by the CLI and never appears in argv
    # or logs.
    #
    # The API key is registered IN the standing workspace's tenant (that is what makes its
    # `tnt` claim scope to that workspace), so it authenticates at the PER-TENANT issuer
    # `https://<slug>.hub.<env>` — NOT the default hub issuer. We derive that from the hub
    # base + workspace-slug. The customer-plane gateway is the SAME shared host for every
    # tenant (`api.<env>`, derived hub.->api.), so we set it explicitly because the CLI's
    # gateway auto-derivation only fires for a bare `hub.<env>` issuer host — a per-tenant
    # `<slug>.hub.<env>` host would otherwise fall back to localhost. Both are stamped onto
    # the session (SSO-2827) so the later `examples` commands need no host flags.
    - name: Sign in (client-credentials API key)
      shell: bash
      env:
        THORYN_API_KEY: ${{ inputs.api-key }}
        ISSUER: ${{ inputs.issuer }}
        WORKSPACE_SLUG: ${{ inputs.workspace-slug }}
        SCOPE: ${{ inputs.scope }}
        # Headless GitHub runners have no OS keychain (Secret Service / D-Bus), so the CLI's default
        # KeychainTokenStore is unavailable. This is the documented CI opt-in for the plaintext file
        # token store (chmod-0600 JSON under $HOME). The token lives only on the ephemeral runner.
        THORYN_CI_PLAINTEXT_TOKENS: "1"
      run: |
        set -euo pipefail
        if [ -z "${THORYN_API_KEY:-}" ]; then
          echo "::error::THORYN_API_KEY is empty — pass secrets.THORYN_API_KEY as the action's api-key input." >&2
          exit 1
        fi
        if [ -z "${WORKSPACE_SLUG:-}" ]; then
          echo "::error::workspace-slug is empty — pass the standing workspace your API key is scoped to." >&2
          exit 1
        fi
        # hub.<env> -> <slug>.hub.<env> (per-tenant issuer) and hub.<env> -> api.<env> (shared gateway).
        tenant_issuer="$(printf '%s' "$ISSUER" | sed -E "s#://hub\.#://${WORKSPACE_SLUG}.hub.#")"
        gateway="$(printf '%s' "$ISSUER" | sed -E "s#://hub\.#://api.#")"
        echo "Signing in at tenant issuer $tenant_issuer (gateway $gateway)."
        # Pass --scope explicitly (even when empty) to OVERRIDE the CLI's interactive default scope. An
        # empty --scope tells the hub to mint the API key's full registered scope set (which the
        # operator granted tenant:applications.write + tenant:applications.read).
        java -jar target/thoryn.jar login --client-credentials \
          --issuer "$tenant_issuer" --gateway "$gateway" --scope "$SCOPE"
        java -jar target/thoryn.jar login --status

    # Provision via the workspace-less recipe, then read the run's receipt to expose ids as outputs.
    # `--set workspaceSlug=<standing-slug>` names the workspace the API key is scoped to; `--yes` skips
    # the confirmation. `--environment` is added only when a non-empty environment input is supplied.
    - name: Provision (apply recipe) and expose outputs
      id: apply
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        ISSUER: ${{ inputs.issuer }}
        WORKSPACE_SLUG: ${{ inputs.workspace-slug }}
        ENVIRONMENT: ${{ inputs.environment }}
        THORYN_CI_PLAINTEXT_TOKENS: "1"
      run: |
        set -euo pipefail
        if [ -z "${WORKSPACE_SLUG:-}" ]; then
          echo "::error::workspace-slug is empty — pass the standing workspace your API key is scoped to." >&2
          exit 1
        fi

        apply_args=(examples apply "$RECIPE" --set "workspaceSlug=${WORKSPACE_SLUG}" --yes)
        if [ -n "${ENVIRONMENT:-}" ]; then
          apply_args+=(--environment "$ENVIRONMENT")
        fi
        java -jar target/thoryn.jar "${apply_args[@]}"

        # The receipt is the portable, secret-free record of what was provisioned.
        java -jar target/thoryn.jar examples receipt "$RECIPE" --output json > receipt.json
        echo "----- receipt -----"
        cat receipt.json
        echo "-------------------"

        slug="$(jq -r '.workspace.slug // ""' receipt.json)"
        [ -n "$slug" ] || slug="$WORKSPACE_SLUG"
        client="$(jq -r '[.resources[] | select(.kind=="application") | .id] | first // ""' receipt.json)"

        # Per-tenant issuer: hub.<env> -> <slug>.hub.<env> (mirrors ThorynConfig.tenantIssuer).
        tenant_issuer="$ISSUER"
        if [ -n "$slug" ]; then
          tenant_issuer="$(printf '%s' "$ISSUER" | sed -E "s#://hub\.#://${slug}.hub.#")"
        fi

        {
          echo "workspace-slug=$slug"
          echo "client-id=$client"
          echo "issuer=$tenant_issuer"
        } >> "$GITHUB_OUTPUT"

        echo "Provisioned ephemeral client '$client' in standing workspace '$slug' (issuer $tenant_issuer)."

    # MANDATORY teardown — runs even when a previous step failed, so a failed run never
    # leaks an ephemeral OAuth client. The recipe teardown deletes ONLY the client; the
    # standing workspace and standing user are untouched. Teardown reads the local run
    # state written by `apply`, so it needs no ids passed in; it is a no-op (best-effort)
    # if `apply` never ran.
    - name: Teardown (delete the ephemeral client)
      if: always()
      shell: bash
      env:
        RECIPE: ${{ inputs.recipe }}
        THORYN_CI_PLAINTEXT_TOKENS: "1"
      run: |
        set -euo pipefail
        java -jar target/thoryn.jar examples teardown "$RECIPE" || {
          echo "::warning::teardown reported an error — verify no '${RECIPE}' client leaked in the standing workspace." >&2
          exit 0
        }
