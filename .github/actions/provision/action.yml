# SSO-3090 (epic SSO-3087) — reusable "provision-as-a-real-customer" composite Action, now driven
# by the repo's PROVISIONING-AS-CODE (`.thoryn/provision.yaml`) on top of its CONNECTION CONTRACT
# (`.thoryn/connection.json`, SSO-2951).
#
# Configures the Thoryn product against SHARED STAGING using ONLY the real product APIs, exercised
# through the `thoryn` CLI and the two committed `.thoryn/` files. There is NO DB seeding, no bespoke
# endpoint, no demo shortcut — the product-boundary rule (CLAUDE.md) applied to CI: every resource is
# created through the same customer-plane workflow a real tenant admin would use, with the same verbs
# a customer runs from their own pipeline.
#
# The two files (both DATA, both schema-validated by the CLI):
#   .thoryn/connection.json  — WHO I AM: workspace slug, client id, the NAME of the secret env var,
#                              the scope set. `thoryn login --connection` signs in from it (SSO-2948).
#   .thoryn/provision.yaml   — WHAT I OWN: the desired-state resources (a sandbox environment + a
#                              loopback OAuth client for this repo). `thoryn provision apply` converges
#                              it (SSO-3088/3089): apply twice issues no writes; a leftover from a
#                              failed run is matched by its converge key rather than duplicated.
#
# What it does, end to end:
#   1. Downloads the prebuilt `thoryn.jar` from a `cli-v*` release of thoryn-io/thoryn-cli (the
#      latest, or `cli-version`) — CI validates the actually-shipped artifact. The verbs this Action
#      runs need cli-v0.11.0 or newer (the first release carrying `thoryn provision apply`).
#   2. Signs in NON-INTERACTIVELY from the connection contract: `thoryn login --connection <file>`.
#      The secret is supplied as the env var the contract NAMES; the base issuer as THORYN_ISSUER
#      (SSO-3296's documented name) and its THORYN_HUB alias. Issuer/gateway/scopes derived by the CLI.
#   3. `thoryn provision plan --file <file>` (read-only, printed for the log), then
#      `thoryn provision apply --file <file> --yes --output json`. SSO-3715 / SSO-3717 (oauthy ADR
#      2026-10-15-platform-is-the-ledger-no-committed-provisioning-receipt): THERE IS NO RECEIPT — nothing is
#      written beside the file; the ids a workflow needs are the apply's own JSON document (`resources[]`:
#      {kind, name, id, environment, action}), kept under $RUNNER_TEMP and exposed as `apply-result`.
#   4. Exposes the workspace slug (from the contract), the provisioned environment slug and the client id
#      (read from `resources[]`), and the per-workspace issuer the CLI resolved at sign-in
#      (`thoryn whoami --output json` — the custom domain once it is ACTIVE, SSO-3415).
#   5. `thoryn provision destroy --file <file> --yes --output json` in an `if: always()` step (unless
#      `destroy: "false"`): OWNER-GATED (SSO-3715) — a `client:` identity removes only the declared resources the
#      platform says it OWNS, children before environments, a `retain: true` resource never (shown as
#      `retained by the file`), and every refusal is a `skip` row with the command a person would run. The JSON
#      document (`{destroyed, removed[], skipped[]}`) is kept under $RUNNER_TEMP and exposed as `destroy-result` so
#      the caller can assert exactly what went (provision-e2e does). Guaranteed on failure so a broken run never
#      leaks what it created.
#
# CONSUMING THIS ACTION FROM ANOTHER REPOSITORY (the thoryn-examples scenarios, a customer pipeline):
#   - uses: actions/checkout@v4                       # YOUR repo, holding YOUR .thoryn/ files
#   - uses: thoryn-io/thoryn-cli/.github/actions/provision@main   # or a cli-v* tag
#     with:
#       client-secret: ${{ secrets.MY_CLI_CLIENT_SECRET }}   # the env var YOUR connection.json names
#       connection: .thoryn/connection.json
#       file: recipes/my-scenario/e2e/provision.yaml          # any provisioning file in your checkout
#   The connection/file paths are resolved in the CALLER's workspace. The env var name the contract's
#   `auth.secretEnv` declares must match `secret-env` (default THORYN_CLI_CI_CLIENT_SECRET).
#
#   SSO-3308 — with a `workload_identity` contract there is no secret at all: omit `client-secret` and
#   grant the calling job `permissions: id-token: write`; the CLI exchanges the job's own OIDC token
#   under the workspace's workload identity trust (`thoryn workload-identity trusts create`). Needs a
#   `cli-v*` release carrying SSO-3308.

name: "Provision Thoryn (as a real customer)"
description: >-
  Download a released thoryn CLI jar, sign in from the committed connection contract
  (.thoryn/connection.json), converge the committed provisioning file (.thoryn/provision.yaml) with
  `thoryn provision apply`, expose the provisioned ids as outputs, and `thoryn provision destroy` on exit.
  Product APIs only — no DB seeding, no demo endpoints, no imperative sign-in, no imperative provisioning.

inputs:
  client-secret:
    description: >-
      The client SECRET of the machine client named by the connection contract's `auth.clientId`.
      Pass it from a repository secret. NEVER a literal — this repo is public. Supplied to the CLI as
      the env var named by `secret-env`; never echoed, never an argv flag. A confidential client declared
      in your provisioning file mints it once (`thoryn provision apply --secret-file`, SSO-3113).
      Required for a `client_credentials` contract; leave it empty for a `workload_identity` contract
      (SSO-3308), which uses no secret — the calling job must then grant `permissions: id-token: write`.
      This repository's own contract is `workload_identity` (SSO-3690): `provision-e2e.yml` passes no secret.
    required: false
    default: ""
  secret-env:
    description: "NAME of the env var the connection contract's `auth.secretEnv` declares for the secret."
    required: false
    default: "THORYN_CLI_CI_CLIENT_SECRET"
  connection:
    description: "Path (in the caller's workspace) to the connection contract the CLI signs in from."
    required: false
    default: ".thoryn/connection.json"
  file:
    description: "Path (in the caller's workspace) to the provisioning file `thoryn provision apply` converges."
    required: false
    default: ".thoryn/provision.yaml"
  issuer:
    description: >-
      SSO-3296 — platform BASE ISSUER to provision against (`https://<label>.<env>`), the DOCUMENTED
      name of the `hub` input. Supplied to the CLI as both THORYN_ISSUER and THORYN_HUB (the name this
      repo's contract's `workspace.hubBaseUrlEnv` declares); the CLI derives the per-workspace issuer +
      gateway from it, reusing whatever host label it carries. Empty ⇒ fall back to `hub`.
    required: false
    default: ""
  hub:
    description: >-
      DEPRECATED alias of `issuer` (SSO-3296, epic SSO-3289 — `hub` is an internal component word).
      Kept so callers pinned to this Action keep working. The default still names today's staging host;
      the SSO-3297 cutover flips it to https://auth.stg.thoryn.org.
    required: false
    default: "https://hub.stg.thoryn.org"
  destroy:
    description: >-
      Run `thoryn provision destroy` on exit ("true"/"false"). Default true: never leak what a run created. Owner-gated
      (SSO-3715): only the declared resources this identity OWNS go; `retain: true` resources and anything it merely
      manages stay and are reported as `skip` rows in the `destroy-result` document.
    required: false
    default: "true"
  confirm:
    description: >-
      Workspace slug confirming PRODUCTION-plane removals on destroy (the SSO-2413 gate). Leave empty
      when the file only owns environment-scoped resources (this repo's default file).
    required: false
    default: ""
  cli-version:
    description: >-
      A specific `cli-v*` release tag to download (default: the latest cli-v* release). Needs cli-v0.36.0 or newer:
      the first release whose `apply` / `destroy` print `--output json` and write no receipt (SSO-3715).
    required: false
    default: ""
  java-version:
    description: "Temurin JDK version used to run the released CLI jar."
    required: false
    default: "21"
  fix-request:
    description: >-
      SSO-3710 (oauthy ADR 2026-10-15 §1) — where the CLI writes the FIX REQUEST (`thoryn-provision-request.json`):
      every right the repository's identity is missing (a plan profile on its trust, `owner` on a declared resource,
      `manager` on a parent environment) with the exact command a workspace admin runs. Written by `thoryn login
      --connection` on a refused exchange whose only local mismatch is the GitHub environment, and by `thoryn provision
      plan|apply` on a plan with an ownership error — through the env var THORYN_FIX_REQUEST (a release predating the
      flag ignores it). Empty ⇒ `$RUNNER_TEMP/thoryn-provision-request.json`. The path is exposed as the `fix-request`
      output; the CALLER uploads it (`actions/upload-artifact`, `if: failure()`, name `thoryn-provision-request`) for the
      Thoryn GitHub App to relay onto the check run. Never a secret: ids, names, commands.
    required: false
    default: ""

outputs:
  workspace-slug:
    description: "Slug of the workspace the resources live in (the connection contract's workspace.slug)."
    value: ${{ steps.apply.outputs.workspace-slug }}
  environment:
    description: "Slug of the (first) environment the file provisioned, or empty when it targets the production plane."
    value: ${{ steps.apply.outputs.environment }}
  client-id:
    description: "Client id of the (first) OAuth application the file provisioned."
    value: ${{ steps.apply.outputs.client-id }}
  issuer:
    description: >-
      Per-workspace OIDC issuer as the CLI resolved it at sign-in: https://<slug>.auth.<env>, or the
      workspace's custom domain (https://auth.acme.com) once that is ACTIVE (SSO-3415). Never carries a
      sandbox /{env} segment.
    value: ${{ steps.apply.outputs.issuer }}
  apply-result:
    description: >-
      SSO-3717 — path of the JSON document `thoryn provision apply --output json` printed (`resources[]` with
      {kind, name, id, environment, action}; secret-free). Under $RUNNER_TEMP, never in the checkout: there is no
      receipt and nothing is written beside the file (SSO-3715).
    value: ${{ steps.apply.outputs.apply-result }}
  destroy-result:
    description: >-
      SSO-3717 — path of the JSON document `thoryn provision destroy --output json` printed on exit
      (`{destroyed, removed[], skipped[]}`; a `skipped[]` row carries the reason — `retained by the file (`retain: true`) …`, `… is not OWNED by this identity …` — and `byHand`, the command a person runs). Exists only when the
      teardown ran (`destroy: "true"`); empty otherwise. A caller asserts the scope of a destroy from it.
    value: ${{ steps.destroy.outputs.destroy-result }}
  fix-request:
    description: >-
      SSO-3710 — the path the CLI writes the fix request to when a step fails on a missing right (the `fix-request`
      input, or `$RUNNER_TEMP/thoryn-provision-request.json`). Exists only after such a failure: upload it with
      `actions/upload-artifact` (`if: failure()`, `if-no-files-found: ignore`, name `thoryn-provision-request`).
    value: ${{ steps.fix-request.outputs.path }}

runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }} (Temurin)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    # Download the prebuilt `thoryn.jar` from a `cli-v*` release rather than rebuilding from source:
    # faster CI, and it validates the actually-shipped artifact. `github.token` is sufficient for a
    # public-release read; a foreign caller's token works the same way.
    - name: Download the released thoryn CLI
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        tag="$CLI_VERSION"
        if [ -z "$tag" ]; then
          tag="$(gh release list --repo thoryn-io/thoryn-cli --limit 40 --json tagName -q '.[].tagName' | grep '^cli-v' | head -1)"
        fi
        if [ -z "$tag" ]; then
          echo "::error::no cli-v* release found in thoryn-io/thoryn-cli — run its release workflow (SSO-2936) first." >&2
          exit 1
        fi
        echo "Using CLI release $tag"
        # SSO-3715 / SSO-3717 — this Action reads the ids from `apply --output json` and the destroy scope from
        # `destroy --output json`, and expects no receipt: the first release with both is cli-v0.36.0. An older jar
        # would write a receipt beside the file and print no JSON, so refuse it up front.
        min="cli-v0.36.0"
        if [ "$(printf '%s\n%s\n' "${min#cli-v}" "${tag#cli-v}" | sort -V | head -1)" != "${min#cli-v}" ]; then
          echo "::error::release $tag predates 'thoryn provision apply --output json' (SSO-3715) — pin cli-version to $min or newer." >&2
          exit 1
        fi
        gh release download "$tag" --repo thoryn-io/thoryn-cli --pattern 'thoryn.jar' --dir .
        test -f thoryn.jar
        # The provisioning verbs (SSO-3088) must be present in the downloaded release.
        if ! java -jar thoryn.jar provision --help 2>/dev/null | grep -q 'apply'; then
          echo "::error::release $tag predates 'thoryn provision apply' (SSO-3088) — pin cli-version to $min or newer." >&2
          exit 1
        fi
        echo "Downloaded thoryn.jar ($(du -h thoryn.jar | cut -f1)) from release $tag."

    # SSO-3710 — ONE path for the fix request, resolved once and read by the sign-in and the apply steps through the
    # CLI's THORYN_FIX_REQUEST, and exposed as the `fix-request` output for the caller's upload step. The CLI writes it
    # only when a step fails on a missing right; a release predating `--fix-request` ignores the variable.
    - name: Resolve the fix-request path
      id: fix-request
      shell: bash
      env:
        FIX_REQUEST: ${{ inputs.fix-request }}
      run: |
        set -euo pipefail
        path="${FIX_REQUEST:-$RUNNER_TEMP/thoryn-provision-request.json}"
        echo "path=$path" >> "$GITHUB_OUTPUT"
        echo "A failed sign-in or plan writes its fix request to $path (upload it as the thoryn-provision-request artifact)."

    # Sign in from the connection contract: the CLI derives the per-tenant issuer, the gateway and the
    # requested scopes from it, reads the secret from the env var the contract names, and stamps the
    # session (SSO-2827) so the later `provision` commands need no host flags.
    - name: Sign in (connection contract)
      shell: bash
      env:
        SECRET_ENV: ${{ inputs.secret-env }}
        SECRET_VALUE: ${{ inputs.client-secret }}
        # SSO-3710 — where a refused workload-identity exchange writes its fix request (the CLI's `--fix-request`).
        THORYN_FIX_REQUEST: ${{ steps.fix-request.outputs.path }}
        # SSO-3296 — `issuer` wins; `hub` is the retained alias. Both env names are exported so a
        # connection contract naming either one resolves.
        THORYN_ISSUER: ${{ inputs.issuer != '' && inputs.issuer || inputs.hub }}
        THORYN_HUB: ${{ inputs.issuer != '' && inputs.issuer || inputs.hub }}
        CONNECTION: ${{ inputs.connection }}
        # Headless runners have no OS keychain; this is the documented CI opt-in for the plaintext
        # file token store (chmod-0600 JSON under $HOME). The token lives only on the ephemeral runner.
        THORYN_CI_PLAINTEXT_TOKENS: "1"
      run: |
        set -euo pipefail
        if [ ! -f "$CONNECTION" ]; then
          echo "::error::connection contract '$CONNECTION' not found — commit .thoryn/connection.json or pass the connection input." >&2
          exit 1
        fi
        method="$(jq -r '.auth.method // ""' "$CONNECTION")"
        if [ "$method" = "workload_identity" ]; then
          # SSO-3308 — no secret: the CLI exchanges this job's own OIDC token under the workspace's trust.
          if [ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" ]; then
            echo "::error::the connection contract uses workload_identity, but this job cannot request an OIDC token — grant the job 'permissions: id-token: write'." >&2
            exit 1
          fi
        else
          if [ -z "${SECRET_VALUE:-}" ]; then
            echo "::error::client-secret is empty — pass the repository secret the connection contract's auth.secretEnv names." >&2
            exit 1
          fi
          declared="$(jq -r '.auth.secretEnv // ""' "$CONNECTION")"
          if [ "$declared" != "$SECRET_ENV" ]; then
            echo "::error::connection contract names secret env var '$declared' but the Action's secret-env input is '$SECRET_ENV' — make them match." >&2
            exit 1
          fi
          # Export the secret under the NAME the contract declares (never on argv, never echoed).
          export "$SECRET_ENV"="$SECRET_VALUE"
        fi
        echo "Signing in from connection contract $CONNECTION (method ${method:-client_credentials}, base issuer $THORYN_ISSUER)."
        java -jar thoryn.jar login --connection "$CONNECTION"
        java -jar thoryn.jar login --status

    # Converge the provisioning file, then read the apply's own JSON document to expose ids as outputs. `plan`
    # first is read-only and lands the diff in the job log; `apply --yes` skips the interactive confirmation;
    # `--output json` prints ONE document on stdout (progress goes to stderr) — the ids a workflow used to read
    # from the receipt (SSO-3715: there is none; nothing is written beside the file).
    - name: Provision (thoryn provision apply) and expose outputs
      id: apply
      shell: bash
      env:
        FILE: ${{ inputs.file }}
        CONNECTION: ${{ inputs.connection }}
        THORYN_CI_PLAINTEXT_TOKENS: "1"
        # SSO-3710 — where a red plan / refused apply writes its fix request (the CLI's `--fix-request`).
        THORYN_FIX_REQUEST: ${{ steps.fix-request.outputs.path }}
      run: |
        set -euo pipefail
        if [ ! -f "$FILE" ]; then
          echo "::error::provisioning file '$FILE' not found — commit .thoryn/provision.yaml or pass the file input." >&2
          exit 1
        fi
        slug="$(jq -r '.workspace.slug // ""' "$CONNECTION")"
        [ -n "$slug" ] || { echo "::error::connection contract '$CONNECTION' has no workspace.slug." >&2; exit 1; }

        java -jar thoryn.jar provision plan --file "$FILE"
        result="$RUNNER_TEMP/thoryn-provision-apply.json"
        java -jar thoryn.jar provision apply --file "$FILE" --yes --output json > "$result"

        # The apply's JSON document is the only record of the ids (secret-free: kinds, names, ids, slugs).
        jq -e '.resources | type == "array"' "$result" > /dev/null \
          || { echo "::error::apply printed no resources[] — a release predating 'apply --output json' (SSO-3715)? Pin cli-version to cli-v0.36.0 or newer." >&2; cat "$result" >&2; exit 1; }
        echo "----- apply result ($result) -----"
        jq . "$result"
        echo "----------------------------------"
        # SSO-3715 — nothing is written beside the file: a receipt here would be an older CLI's, and it must not land in a commit.
        receipt="$(dirname "$FILE")/$(basename "${FILE%.*}").receipt.json"
        if [ -f "$receipt" ]; then
          echo "::error::$receipt was written beside the file — this release still writes a receipt; pin cli-version to cli-v0.36.0 or newer (SSO-3715)." >&2
          exit 1
        fi

        # An `environment` row carries its own slug on attributes.slug (and on `environment`); the first `application` row's id is the client.
        environment="$(jq -r '[.resources[] | select(.kind=="environment") | (.attributes.slug // .environment // "")] | first // ""' "$result")"
        client="$(jq -r '[.resources[] | select(.kind=="application") | .id] | first // ""' "$result")"
        # SSO-3415 — the per-workspace issuer is the one the CLI RESOLVED at sign-in (the session's
        # issuer), never re-derived here: once the workspace's custom domain is ACTIVE its platform host
        # answers 410 naming the custom-domain issuer, and the CLI signed in there. The session issuer of
        # a sandbox workload-identity sign-in carries `/{env}`; the workspace issuer is its origin (a
        # workspace issuer — platform host or custom domain — never has a path).
        tenant_issuer="$(java -jar thoryn.jar whoami --output json | jq -r '(.issuer // "") | (capture("^(?<origin>https?://[^/]+)").origin // "")')"
        [ -n "$tenant_issuer" ] || { echo "::error::the CLI session names no issuer after sign-in (thoryn whoami --output json)." >&2; exit 1; }

        {
          echo "workspace-slug=$slug"
          echo "environment=$environment"
          echo "client-id=$client"
          echo "issuer=$tenant_issuer"
          echo "apply-result=$result"
        } >> "$GITHUB_OUTPUT"
        echo "Provisioned client '$client' in workspace '$slug'${environment:+ (environment $environment)} — issuer $tenant_issuer."

    # MANDATORY teardown — runs even when a previous step failed, so a failed run never leaks what it created.
    # `destroy` is OWNER-GATED (SSO-3715; ADR 2026-10-15 §1): a `client:` identity removes only the declared
    # resources the platform says it OWNS, children before environments; `retain: true` resources and anything
    # it merely manages are `skip` rows (reason + the command a person runs), so the standing workspace and
    # anything not created by this identity are never touched. `--confirm` is still required for a production-plane
    # removal. The destroy's JSON document is kept and exposed as `destroy-result` so the caller can assert the
    # scope of what went; a destroy error is a warning here (the caller's assertion on the document is the gate).
    - name: Teardown (thoryn provision destroy)
      id: destroy
      if: always() && inputs.destroy == 'true'
      shell: bash
      env:
        FILE: ${{ inputs.file }}
        CONFIRM: ${{ inputs.confirm }}
        THORYN_CI_PLAINTEXT_TOKENS: "1"
      run: |
        set -euo pipefail
        [ -f thoryn.jar ] || { echo "no CLI jar — nothing was provisioned"; exit 0; }
        result="$RUNNER_TEMP/thoryn-provision-destroy.json"
        echo "destroy-result=$result" >> "$GITHUB_OUTPUT"
        args=(provision destroy --file "$FILE" --yes --output json)
        [ -n "${CONFIRM:-}" ] && args+=(--confirm "$CONFIRM")
        rc=0
        java -jar thoryn.jar "${args[@]}" > "$result" || rc=$?
        echo "----- destroy result ($result) -----"
        if [ -s "$result" ]; then jq . "$result" || cat "$result"; else echo "(no document)"; fi
        echo "------------------------------------"
        if [ "$rc" -ne 0 ]; then
          echo "::warning::destroy exited $rc — something it planned to remove stays live; check the document above and 'thoryn env list' / 'thoryn clients list --environment <sandbox>' for what $FILE declares." >&2
        fi
        exit 0
