# SSO-3090 (epic SSO-3087) — reusable "provision-as-a-real-customer" composite Action, now driven
# by the repo's PROVISIONING-AS-CODE (`.thoryn/provision.yaml`) on top of its CONNECTION CONTRACT
# (`.thoryn/connection.json`, SSO-2951).
#
# Configures the Thoryn product against SHARED STAGING using ONLY the real product APIs, exercised
# through the `thoryn` CLI and the two committed `.thoryn/` files. There is NO DB seeding, no bespoke
# endpoint, no demo shortcut — the product-boundary rule (CLAUDE.md) applied to CI: every resource is
# created through the same customer-plane workflow a real tenant admin would use, with the same verbs
# a customer runs from their own pipeline.
#
# The two files (both DATA, both schema-validated by the CLI):
#   .thoryn/connection.json  — WHO I AM: workspace slug, client id, the NAME of the secret env var,
#                              the scope set. `thoryn login --connection` signs in from it (SSO-2948).
#   .thoryn/provision.yaml   — WHAT I OWN: the desired-state resources (a sandbox environment + a
#                              loopback OAuth client for this repo). `thoryn provision apply` converges
#                              it (SSO-3088/3089): apply twice issues no writes; a leftover from a
#                              failed run is adopted by its key rather than duplicated.
#
# What it does, end to end:
#   1. Downloads the prebuilt `thoryn.jar` from a `cli-v*` release of thoryn-io/thoryn-cli (the
#      latest, or `cli-version`) — CI validates the actually-shipped artifact. The verbs this Action
#      runs need cli-v0.11.0 or newer (the first release carrying `thoryn provision apply`).
#   2. Signs in NON-INTERACTIVELY from the connection contract: `thoryn login --connection <file>`.
#      The secret is supplied as the env var the contract NAMES; the hub base as the env var the
#      contract names for it (THORYN_HUB). Issuer/gateway/scopes are derived by the CLI.
#   3. `thoryn provision plan --file <file>` (read-only, printed for the log), then
#      `thoryn provision apply --file <file> --yes`. The receipt the CLI writes NEXT TO the file
#      (`<name>.receipt.json`, secret-free) is the ownership ledger.
#   4. Exposes the workspace slug (from the contract), the provisioned environment slug, the client
#      id, the per-tenant issuer and the receipt path as outputs (read from the receipt).
#   5. `thoryn provision destroy --file <file> --yes` in an `if: always()` step (unless
#      `destroy: "false"`): removes everything the receipt owns, child-first — the sandbox hard-delete
#      cascades the client. Guaranteed on failure so a broken run never leaks a sandbox.
#
# CONSUMING THIS ACTION FROM ANOTHER REPOSITORY (the thoryn-examples scenarios, a customer pipeline):
#   - uses: actions/checkout@v4                       # YOUR repo, holding YOUR .thoryn/ files
#   - uses: thoryn-io/thoryn-cli/.github/actions/provision@main   # or a cli-v* tag
#     with:
#       client-secret: ${{ secrets.MY_CLI_CLIENT_SECRET }}   # the env var YOUR connection.json names
#       connection: .thoryn/connection.json
#       file: recipes/my-scenario/e2e/provision.yaml          # any provisioning file in your checkout
#   The connection/file paths are resolved in the CALLER's workspace. The env var name the contract's
#   `auth.secretEnv` declares must match `secret-env` (default THORYN_CLI_CI_CLIENT_SECRET).

name: "Provision Thoryn (as a real customer)"
description: >-
  Download a released thoryn CLI jar, sign in from the committed connection contract
  (.thoryn/connection.json), converge the committed provisioning file (.thoryn/provision.yaml) with
  `thoryn provision apply`, expose the provisioned ids as outputs, and `thoryn provision destroy` on exit.
  Product APIs only — no DB seeding, no demo endpoints, no imperative sign-in, no imperative provisioning.

inputs:
  client-secret:
    description: >-
      The client SECRET of the machine client named by the connection contract's `auth.clientId`.
      Pass it from a repository secret. NEVER a literal — this repo is public. Supplied to the CLI as
      the env var named by `secret-env`; never echoed, never an argv flag. See `.thoryn/README.md`
      for the one-time bootstrap that mints it (`thoryn provision ci-identity`).
    required: true
  secret-env:
    description: "NAME of the env var the connection contract's `auth.secretEnv` declares for the secret."
    required: false
    default: "THORYN_CLI_CI_CLIENT_SECRET"
  connection:
    description: "Path (in the caller's workspace) to the connection contract the CLI signs in from."
    required: false
    default: ".thoryn/connection.json"
  file:
    description: "Path (in the caller's workspace) to the provisioning file `thoryn provision apply` converges."
    required: false
    default: ".thoryn/provision.yaml"
  hub:
    description: >-
      Hub BASE URL to provision against. Supplied to the CLI as THORYN_HUB (the name the contract's
      `workspace.hubBaseUrlEnv` declares); the CLI derives the per-tenant issuer + gateway from it.
    required: false
    default: "https://hub.stg.thoryn.org"
  destroy:
    description: "Run `thoryn provision destroy` on exit (\"true\"/\"false\"). Default true: never leak a sandbox from CI."
    required: false
    default: "true"
  confirm:
    description: >-
      Workspace slug confirming PRODUCTION-plane removals on destroy (the SSO-2413 gate). Leave empty
      when the file only owns environment-scoped resources (this repo's default file).
    required: false
    default: ""
  cli-version:
    description: "A specific `cli-v*` release tag to download (default: the latest cli-v* release)."
    required: false
    default: ""
  java-version:
    description: "Temurin JDK version used to run the released CLI jar."
    required: false
    default: "21"

outputs:
  workspace-slug:
    description: "Slug of the workspace the resources live in (the connection contract's workspace.slug)."
    value: ${{ steps.apply.outputs.workspace-slug }}
  environment:
    description: "Slug of the (first) environment the file provisioned, or empty when it targets the production plane."
    value: ${{ steps.apply.outputs.environment }}
  client-id:
    description: "Client id of the (first) OAuth application the file provisioned."
    value: ${{ steps.apply.outputs.client-id }}
  issuer:
    description: "Per-tenant OIDC issuer for the workspace (https://<slug>.hub.<env>)."
    value: ${{ steps.apply.outputs.issuer }}
  receipt:
    description: "Path of the secret-free provisioning receipt (<file-name>.receipt.json, next to the file)."
    value: ${{ steps.apply.outputs.receipt }}

runs:
  using: composite
  steps:
    - name: Set up JDK ${{ inputs.java-version }} (Temurin)
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: ${{ inputs.java-version }}

    # Download the prebuilt `thoryn.jar` from a `cli-v*` release rather than rebuilding from source:
    # faster CI, and it validates the actually-shipped artifact. `github.token` is sufficient for a
    # public-release read; a foreign caller's token works the same way.
    - name: Download the released thoryn CLI
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
        CLI_VERSION: ${{ inputs.cli-version }}
      run: |
        set -euo pipefail
        tag="$CLI_VERSION"
        if [ -z "$tag" ]; then
          tag="$(gh release list --repo thoryn-io/thoryn-cli --limit 40 --json tagName -q '.[].tagName' | grep '^cli-v' | head -1)"
        fi
        if [ -z "$tag" ]; then
          echo "::error::no cli-v* release found in thoryn-io/thoryn-cli — run its release workflow (SSO-2936) first." >&2
          exit 1
        fi
        echo "Using CLI release $tag"
        gh release download "$tag" --repo thoryn-io/thoryn-cli --pattern 'thoryn.jar' --dir .
        test -f thoryn.jar
        # The provisioning verbs (SSO-3088) must be present in the downloaded release.
        if ! java -jar thoryn.jar provision --help 2>/dev/null | grep -q 'apply'; then
          echo "::error::release $tag predates 'thoryn provision apply' (SSO-3088) — pin cli-version to cli-v0.11.0 or newer." >&2
          exit 1
        fi
        echo "Downloaded thoryn.jar ($(du -h thoryn.jar | cut -f1)) from release $tag."

    # Sign in from the connection contract: the CLI derives the per-tenant issuer, the gateway and the
    # requested scopes from it, reads the secret from the env var the contract names, and stamps the
    # session (SSO-2827) so the later `provision` commands need no host flags.
    - name: Sign in (connection contract)
      shell: bash
      env:
        SECRET_ENV: ${{ inputs.secret-env }}
        SECRET_VALUE: ${{ inputs.client-secret }}
        THORYN_HUB: ${{ inputs.hub }}
        CONNECTION: ${{ inputs.connection }}
        # Headless runners have no OS keychain; this is the documented CI opt-in for the plaintext
        # file token store (chmod-0600 JSON under $HOME). The token lives only on the ephemeral runner.
        THORYN_CI_PLAINTEXT_TOKENS: "1"
      run: |
        set -euo pipefail
        if [ -z "${SECRET_VALUE:-}" ]; then
          echo "::error::client-secret is empty — pass the repository secret the connection contract's auth.secretEnv names." >&2
          exit 1
        fi
        if [ ! -f "$CONNECTION" ]; then
          echo "::error::connection contract '$CONNECTION' not found — commit .thoryn/connection.json or pass the connection input." >&2
          exit 1
        fi
        declared="$(jq -r '.auth.secretEnv // ""' "$CONNECTION")"
        if [ "$declared" != "$SECRET_ENV" ]; then
          echo "::error::connection contract names secret env var '$declared' but the Action's secret-env input is '$SECRET_ENV' — make them match." >&2
          exit 1
        fi
        # Export the secret under the NAME the contract declares (never on argv, never echoed).
        export "$SECRET_ENV"="$SECRET_VALUE"
        echo "Signing in from connection contract $CONNECTION (hub base $THORYN_HUB)."
        java -jar thoryn.jar login --connection "$CONNECTION"
        java -jar thoryn.jar login --status

    # Converge the provisioning file, then read its receipt to expose ids as outputs. `plan` first is
    # read-only and lands the diff in the job log; `apply --yes` skips the interactive confirmation.
    - name: Provision (thoryn provision apply) and expose outputs
      id: apply
      shell: bash
      env:
        FILE: ${{ inputs.file }}
        HUB: ${{ inputs.hub }}
        CONNECTION: ${{ inputs.connection }}
        THORYN_CI_PLAINTEXT_TOKENS: "1"
      run: |
        set -euo pipefail
        if [ ! -f "$FILE" ]; then
          echo "::error::provisioning file '$FILE' not found — commit .thoryn/provision.yaml or pass the file input." >&2
          exit 1
        fi
        slug="$(jq -r '.workspace.slug // ""' "$CONNECTION")"
        [ -n "$slug" ] || { echo "::error::connection contract '$CONNECTION' has no workspace.slug." >&2; exit 1; }

        java -jar thoryn.jar provision plan --file "$FILE"
        java -jar thoryn.jar provision apply --file "$FILE" --yes

        # The receipt is written next to the file as <name>.receipt.json — the secret-free ownership ledger.
        receipt="$(dirname "$FILE")/$(basename "${FILE%.*}").receipt.json"
        test -f "$receipt" || { echo "::error::no receipt at $receipt after apply." >&2; exit 1; }
        echo "----- receipt ($receipt) -----"
        cat "$receipt"
        echo "------------------------------"

        environment="$(jq -r '[.resources[] | select(.kind=="environment") | .attributes.slug] | first // ""' "$receipt")"
        client="$(jq -r '[.resources[] | select(.kind=="application") | .id] | first // ""' "$receipt")"
        # Per-tenant issuer: hub.<env> -> <slug>.hub.<env> (mirrors ThorynConfig.tenantIssuer).
        tenant_issuer="$(printf '%s' "$HUB" | sed -E "s#://hub\.#://${slug}.hub.#")"

        {
          echo "workspace-slug=$slug"
          echo "environment=$environment"
          echo "client-id=$client"
          echo "issuer=$tenant_issuer"
          echo "receipt=$receipt"
        } >> "$GITHUB_OUTPUT"
        echo "Provisioned client '$client' in workspace '$slug'${environment:+ (environment $environment)} — issuer $tenant_issuer."

    # MANDATORY teardown — runs even when a previous step failed, so a failed run never leaks a
    # sandbox. `destroy` removes ONLY what the receipt owns (child-first; adopted resources are left in
    # place), so the standing workspace and anything not created by this file are never touched.
    - name: Teardown (thoryn provision destroy)
      if: always() && inputs.destroy == 'true'
      shell: bash
      env:
        FILE: ${{ inputs.file }}
        CONFIRM: ${{ inputs.confirm }}
        THORYN_CI_PLAINTEXT_TOKENS: "1"
      run: |
        set -euo pipefail
        [ -f thoryn.jar ] || { echo "no CLI jar — nothing was provisioned"; exit 0; }
        args=(provision destroy --file "$FILE" --yes)
        [ -n "${CONFIRM:-}" ] && args+=(--confirm "$CONFIRM")
        java -jar thoryn.jar "${args[@]}" || {
          echo "::warning::destroy reported an error — check 'thoryn env list' for a leaked sandbox owned by $FILE." >&2
          exit 0
        }
