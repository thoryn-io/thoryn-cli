# Build-stamped version for `thoryn --version` (SSO-2953).
# Maven resource filtering substitutes ${project.version} at build time; the
# value equals the ${revision} property (0.0.1-SNAPSHOT for local/dev builds,
# the release version when the release workflow passes -Drevision=<version>).
# Read at runtime by com.devnow.thoryn.cli.VersionProvider.
thoryn.version=${project.version}
