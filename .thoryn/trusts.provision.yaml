# SSO-3697 / SSO-3705 (parent SSO-3659) — the ONE workload identity trust this repository signs in with, DECLARED
# (SSO-3689's `kind: workloadIdentityTrust`) in a file a FOUNDER applies from their own session. Not CI, and not by
# accident:
#
#  * The ownership gate reaches a trust through its ENVIRONMENT, and this trust lives on the `thoryn` workspace's
#    PRODUCTION plane (its token must address `application:cli` and the `cli-ci` sandbox, whose parent is the
#    workspace). So converging — or merely ADOPTING — it needs `manager` on the WORKSPACE
#    (`ProvisionEngine.gateTrust`): the confined CI identity holds `manager` on `environment:ci` only, and giving it
#    workspace reach is exactly what epic SSO-3108 forbids. Declared in `.thoryn/provision.yaml`, the trust would
#    plan `access_not_owned` for every App-dispatched run — whatever scopes the CI trust carried, including
#    `tenant:workload-identity.write`.
#  * A file cannot declare the trust its own identity signs in with (`workload_identity_trust_is_self`): the apply
#    job IS `thoryn-cli-ci`, so `thoryn-cli-ci` can only ever be declared by a file someone else applies.
#
# A founder is `manager` of the workspace and holds `tenant:workload-identity.write` (the `cli` login client's scope
# set), so this file converges from a founder's laptop — the bootstrap limit of the credential ladder (a trust is
# created by someone who already holds the scopes it will carry), kept as code:
#
#   thoryn login --workspace thoryn --issuer https://auth.stg.thoryn.org
#   thoryn env use production
#   thoryn provision plan  --file .thoryn/trusts.provision.yaml       # thoryn-cli-ci: adopted (must match live)
#   thoryn provision apply --file .thoryn/trusts.provision.yaml --yes
#
# The receipt (`.thoryn/trusts.provision.receipt.json`, git-ignored, local to the founder) records thoryn-cli-ci as
# adopted. A trust's pins and scopes are IMMUTABLE on the hub: a declared field that differs from the live trust is
# the plan error `workload_identity_trust_immutable` — align the file, or delete and re-apply to re-create (which
# mints a NEW wi_ client: re-paste it into connection.json and provision.yaml). The App-dispatched workflow never
# reads this file; it plans and applies `.thoryn/provision.yaml` only. `destroy` of this file would delete the trust
# and stop CI signing in at once — a founder's deliberate act, never automation's.
#
# ONE trust for plan AND apply (SSO-3705 — SSO-3699 option B, product owner 2026-10-14). SSO-3697 declared a second
# trust here, `thoryn-cli-ci-plan`, pinned to the unprotected `thoryn-provision-e2e-plan` environment with read-only
# scopes; it was never created, and its placeholder client in `provision.yaml`'s grants stopped provision-e2e run
# 38547022158. Under option B the hub gives a trust a PLAN PROFILE (SSO-3700): the same `wi_` client, minted the
# read-only scopes when the job runs in the `-plan` environment and the write scopes in the reviewed one. The
# profile is NOT a field of this declaration yet — SSO-3704 adds it to `thoryn-cli-ci` once the hub ships it (the
# CLI verb and its flags are SSO-3702's to settle; see `.thoryn/README.md`). Until then a plan job in the `-plan`
# environment is refused at sign-in with `environment_mismatch`: this trust pins the reviewed environment only.
apiVersion: thoryn.io/provision/v1
resources:
  # SSO-3690 — the CI identity: created once by the founder on 2026-10-14 (clientId wi_10a7b379c79f7d1353f5798d),
  # adopted here by name. Pinned to the REVIEWED GitHub environment `thoryn-provision-e2e`: the apply job of
  # thoryn-provisioning.yml and the manual provision-e2e.yml run in it. Carries the six write-capable scopes
  # `.thoryn/connection.json` requests (CiTrustsFileConformanceTest pins the two equal).
  - kind: workloadIdentityTrust
    name: thoryn-cli-ci
    spec:
      provider: github_actions
      github:
        repository: thoryn-io/thoryn-cli
        ownerId: 229451779
        repositoryId: 1361536515
        environment: thoryn-provision-e2e
        ref: refs/heads/main
        githubHostedRunnersOnly: true
      scopes:
        - tenant:environments.read
        - tenant:environments.write
        - tenant:applications.read
        - tenant:applications.write
        - tenant:access.read
        - tenant:access.write
      confirmProduction: true
