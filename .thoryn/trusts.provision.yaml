# SSO-3697 / SSO-3705 / SSO-3704 (parent SSO-3659) — the ONE workload identity trust this repository signs in with,
# DECLARED (SSO-3689's `kind: workloadIdentityTrust`) in a file a FOUNDER applies from their own session. Not CI, and
# not by accident:
#
#  * The ownership gate reaches a trust through its ENVIRONMENT, and this trust lives on the `thoryn` workspace's
#    PRODUCTION plane (its token must address `application:cli` and the `cli-ci` sandbox, whose parent is the
#    workspace). So converging — or merely ADOPTING — it needs `manager` on the WORKSPACE
#    (`ProvisionEngine.gateTrust`): the confined CI identity holds `manager` on `environment:ci` only, and giving it
#    workspace reach is exactly what epic SSO-3108 forbids. Declared in `.thoryn/provision.yaml`, the trust would
#    plan `access_not_owned` for every App-dispatched run — whatever scopes the CI trust carried, including
#    `tenant:workload-identity.write`.
#  * A file cannot declare the trust its own identity signs in with (`workload_identity_trust_is_self`): the apply
#    job IS `thoryn-cli-ci`, so `thoryn-cli-ci` can only ever be declared by a file someone else applies.
#
# A founder is `manager` of the workspace and holds `tenant:workload-identity.write` (the `cli` login client's scope
# set), so this file converges from a founder's laptop — the bootstrap limit of the credential ladder (a trust is
# created by someone who already holds the scopes it will carry), kept as code:
#
#   thoryn login --workspace thoryn --issuer https://auth.stg.thoryn.org
#   thoryn env use production
#   thoryn provision plan  --file .thoryn/trusts.provision.yaml       # thoryn-cli-ci: adopted (must match live)
#   thoryn provision apply --file .thoryn/trusts.provision.yaml --yes
#
# Nothing is written beside this file (SSO-3715: the engine writes no receipt — the plan of a live, matching trust is a
# `noop` row, and the platform is the ledger). A trust's pins are IMMUTABLE on the hub: a declared pin that differs from the live trust is
# the plan error `workload_identity_trust_immutable` — align the file, or delete and re-apply to re-create (which
# mints a NEW wi_ client: re-paste it into connection.json and provision.yaml). The ONE additive exception is the
# plan profile below; its SCOPES change in place (SSO-3925 — removing from CI, adding a person's passkey act). The App-dispatched workflow never reads this file; it plans and applies `.thoryn/provision.yaml`
# only. `destroy` of this file would delete the trust and stop CI signing in at once — a founder's deliberate act,
# never automation's.
#
# ONE TRUST, TWO PROFILES (SSO-3699 option B, product owner 2026-10-14; oauthy ADR
# 2026-10-14-plan-identity-and-resource-ownership). The same `wi_` client signs in for plan AND apply; what differs is
# the GitHub environment the job runs in, and the hub mints only the matched profile's scopes:
#   * `github.environment` — the APPLY profile: the reviewed environment `thoryn-provision-e2e`, the six `scopes`.
#   * `plan.environment`   — the PLAN profile: the unprotected environment `thoryn-provision-e2e-plan`, read-only.
# A job in neither environment is refused at the exchange. A plan job is read-only by CONSTRUCTION — the profile can
# only carry `.read` scopes (`plan_scope_not_read_only`) — not because a second trust was configured correctly: there
# is no second trust, no second `wi_` client, and `connection.json` is the one contract both jobs sign in with
# (`thoryn login --connection` picks the profile from the job's own OIDC `environment` claim and requests no scope
# outside the apply environment). SSO-3704 is the dogfood migration that gave `thoryn-cli-ci` this profile.
#
# HOW THE PROFILE REACHES THE LIVE TRUST. The trust was created (SSO-3690, 2026-10-14) WITHOUT a plan profile. Declaring
# `plan:` here on a live trust that has none is the one field the engine converges ADDITIVELY (SSO-3702): a founder's
# `thoryn provision apply --file .thoryn/trusts.provision.yaml` issues the single `POST …/trusts/{id}/plan-profile`
# — the wi_ client, its `owner` relation on `application:cli`, its `manager` grant on the sandbox and the committed
# `connection.json` all stay; nothing is re-created or re-pasted. Once set, a profile's environment is immutable like every
# other pin (a live one that differs is `workload_identity_trust_immutable` — re-create the trust); its scopes change in place.
apiVersion: thoryn.io/provision/v1
resources:
  # SSO-3690 — the CI identity: created once by the founder on 2026-10-14 (clientId wi_10a7b379c79f7d1353f5798d),
  # adopted here by name. Pinned to the REVIEWED GitHub environment `thoryn-provision-e2e`: the apply job of
  # thoryn-provisioning.yml and the manual provision-e2e.yml run in it. Carries the six write-capable scopes
  # `.thoryn/connection.json` requests (CiTrustsFileConformanceTest pins the two equal).
  - kind: workloadIdentityTrust
    name: thoryn-cli-ci
    spec:
      provider: github_actions
      github:
        repository: thoryn-io/thoryn-cli
        ownerId: 229451779
        repositoryId: 1361536515
        environment: thoryn-provision-e2e
        ref: refs/heads/main
        githubHostedRunnersOnly: true
      scopes:
        - tenant:environments.read
        - tenant:environments.write
        - tenant:applications.read
        - tenant:applications.write
        - tenant:access.read
        - tenant:access.write
      # SSO-3704 — the PLAN profile (SSO-3699 option B): the plan job of thoryn-provisioning.yml runs in this
      # UNPROTECTED GitHub environment and is minted read-only scopes there. `scopes` is deliberately OMITTED: the hub
      # DERIVES the plan scopes as every `.read` member of `scopes` above — tenant:environments.read
      # tenant:applications.read tenant:access.read — which is exactly the set planning `provision.yaml` needs
      # (CiIdentityFixture.scopesToPlan). Listing them would pin what the hub already derives; a listed scope that is
      # not `.read` is `plan_scope_not_read_only`, one not in `scopes` is `plan_scope_not_subset`.
      plan:
        environment: thoryn-provision-e2e-plan
      confirmProduction: true
