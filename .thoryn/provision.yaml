# SSO-3090 (epic SSO-3087) — this repo's PROVISIONING-AS-CODE: the "what I own" half of `.thoryn/`,
# next to `connection.json` ("who I am", SSO-2948). thoryn-cli is the REFERENCE CONSUMER of the
# `thoryn provision plan | apply | destroy` verbs it ships (SSO-3088/3089): its own CI converges this
# file against shared staging, runs against the result, and destroys it on exit. A customer binds a
# repository to Thoryn the same way — the identical files, the identical verbs.
#
# What CI needs: a throwaway SANDBOX environment inside the contract's workspace, and a public
# loopback OAuth client inside that sandbox (what the retired `ci-signin` recipe used to create on the
# production plane). Everything is environment-scoped, so `destroy` needs no production-plane
# confirmation: the sandbox hard-delete (confirmed with its own slug) cascades the client.
#
# Converge, not create: the environment slug is FIXED (`provision-e2e` serialises runs with a
# concurrency group). If a previous run failed to destroy it, the next `apply` ADOPTS the leftover
# sandbox by its slug instead of creating a second one — adopted resources are converged but never
# deleted by `destroy`, so a leaked sandbox stays visible in `thoryn env list` until an operator removes
# it (`thoryn env delete <id> --confirm cli-ci`). No secrets live here; none are needed.
apiVersion: thoryn.io/provision/v1
resources:
  - kind: environment
    name: ci
    spec:
      slug: cli-ci
      displayName: "thoryn-cli CI sandbox"

  - kind: application
    name: loopback-rp
    environment: ci
    spec:
      displayName: "thoryn-cli CI loopback client"
      clientType: public
      grantTypes: [authorization_code]
      scopes: [openid, profile, email]
      # RFC 8252 loopback redirect (port-agnostic) + OIDC RP-Initiated Logout post-logout URI (SSO-2897).
      redirectUris: ["http://127.0.0.1/callback"]
      postLogoutRedirectUris: ["http://127.0.0.1/"]
