# SSO-3090 (epic SSO-3087) — this repo's PROVISIONING-AS-CODE: the "what I own" half of `.thoryn/`,
# next to `connection.json` ("who I am", SSO-2948). thoryn-cli is the REFERENCE CONSUMER of the
# `thoryn provision plan | apply | destroy` verbs it ships (SSO-3088/3089): its own CI converges this
# file against shared staging, runs against the result, and removes what it created on exit. A customer binds a
# repository to Thoryn the same way — the identical files, the identical verbs.
#
# What this file owns:
#  - `cli` (SSO-3104): the CLI's OWN customer-plane login client — the public PKCE client every
#    `thoryn login --workspace <slug>` signs in with. It lives on the `thoryn` workspace's PRODUCTION
#    plane (no `environment:`), replacing the hub-seeded `thoryn-cli` client on the shared default tenant
#    (the platform is moving everything off that tenant). A founder creates it ONCE with
#    `thoryn provision apply` while switched into the `thoryn` workspace; every later `apply` (CI signs in
#    as the CI identity, whose receipt does not own it) ADOPTS it by its fixed `clientId` and
#    converges its non-secret shape — adopted resources are never deleted by `destroy`.
#  - What CI needs (SSO-3090): a SANDBOX environment inside the contract's workspace, and a public
#    loopback OAuth client inside that sandbox.
#
# What this file does NOT own any more — the CI identity (SSO-3690, parent SSO-3659; the credential ladder of
# oauthy ADR 2026-10-14-kubernetes-workload-identity-and-runtime-credential-pull, rung 4 "courier: never"):
#  Until SSO-3690 this file declared `ci`, a confidential `client_credentials` client `cli-ci` whose secret a
#  founder minted once (`apply --secret-file`) and carried into the repository secret
#  `THORYN_CLI_CI_CLIENT_SECRET` — the courier pattern, in the repository that ships the ladder's tooling.
#  The identity is now a GitHub Actions WORKLOAD IDENTITY TRUST on the `thoryn` workspace's production
#  plane (`thoryn workload-identity trusts create`, see `.thoryn/README.md`): the e2e job exchanges its own
#  OIDC token for a short-lived token of the trust's `wi_…` client, so NO secret exists anywhere — not in
#  this file, not in a GitHub secret, not in a receipt. The trust is created ONCE by a founder and is only
#  REFERENCED here (by the `grants:` subject below) and in `connection.json`; it is not declared as a
#  resource — the engine has no trust kind yet (SSO-3689 adds `workloadIdentityTrust`; once it is on main
#  the trust can be declared and adopted here as a follow-up).
#
#  HOW THE OLD CLIENT IS REMOVED — once, by the founder whose receipt owns it, as a REVIEWED removal
#  (SSO-3659: removals only through `--prune`, never by automation; `destroy` is never run by a pipeline):
#    thoryn login --workspace thoryn --issuer https://auth.stg.thoryn.org
#    thoryn provision plan  --file .thoryn/provision.yaml --prune          # shows "- application ci (cli-ci)"
#    thoryn provision apply --file .thoryn/provision.yaml --prune --confirm thoryn --yes
#  `--prune` deletes exactly the owned resources this file no longer declares — the one `application/ci`
#  entry of the founder's receipt (production plane, hence `--confirm thoryn`) — and the receipt drops that
#  entry (`.thoryn/provision.receipt.json`, git-ignored, so the effect is local to the founder's machine).
#  The same apply converges the sandbox's `grants:` block: the trust's client gains `manager`, and the
#  `client:cli-ci manager` grant the founder's receipt recorded is revoked. If the founder's receipt no
#  longer exists nothing is owned and `--prune` removes nothing: delete the client directly instead,
#  `thoryn clients delete cli-ci --confirm thoryn`. Either way: NOT a `destroy` — that would also remove the
#  sandbox and everything the receipt owns.
#
# The sandbox is a LONG-LIVED FIXTURE, not a per-run throwaway (settled by the product owner,
# 2026-09-16). Creating a resource requires `manager` on its PARENT, and the parent of an environment
# is the workspace — so the confined CI identity structurally CANNOT create or delete an
# environment. A founder creates the sandbox once (with this file); every CI run ADOPTS it by its fixed
# slug and manages only what lives INSIDE it: the loopback client is created by each run and removed by
# `destroy` on exit. Granting the CI identity manager on the WORKSPACE so it could create per-run sandboxes was
# considered and rejected — by containment it would reach the whole production plane, including the
# `cli` login client above, which is exactly what epic SSO-3108 exists to prevent.
#
# `provision-e2e` serialises runs with a concurrency group, so one fixed sandbox is enough. It also
# asserts the confinement itself after every apply: as the CI identity, `thoryn env list` must return ONLY this
# sandbox, and a GET of a foreign environment must answer 404. No secrets live here; none are needed.
apiVersion: thoryn.io/provision/v1
resources:
  # SSO-3104 — the `thoryn` CLI's login client, in the `thoryn` workspace (production plane).
  - kind: application
    name: cli
    spec:
      clientId: cli                       # fixed id: ThorynConfig.DEFAULT_CLIENT_ID signs in with it
      displayName: "Thoryn CLI"
      clientType: public                  # RFC 8252 native app: PKCE, no secret
      grantTypes:
        - authorization_code
        - refresh_token
        - "urn:ietf:params:oauth:grant-type:device_code"   # `thoryn login --device-code`
      # RFC 8252 §7.3 literal-IP loopback redirects (port-agnostic); the CLI binds an ephemeral port.
      redirectUris: ["http://127.0.0.1/callback", "http://[::1]/callback"]
      # Exactly the scopes any `thoryn` command can request (CiProvisionFileConformanceTest pins this to
      # the CLI's sources); the hub grants a login only what the client holds AND the admin actually has.
      scopes:
        - openid
        - offline_access
        - tenant:applications.read
        - tenant:applications.write
        - tenant:clients.read
        - tenant:users.read
        - tenant:users.write
        - tenant:federation.read
        - tenant:federation.write
        - tenant:audit.read
        - tenant:environments.read
        - tenant:environments.write
        - tenant:email.read
        - tenant:email.write
        - tenant:idp.read
        - tenant:idp.write
        # SSO-3113 — `thoryn access …` + the `grants:` block of a provisioning file. Grantable only once
        # the product side (SSO-3112) has deployed the scopes; a founder re-applies this file after that.
        - tenant:access.read
        - tenant:access.write
        # SSO-3303 — `thoryn domain …` (the workspace's custom domain). Granted to this client by oathy hub
        # V181 before any CLI release requests it, so converging this file finds it already present.
        - tenant:domains.read
        - tenant:domains.write
        # SSO-3369 — `thoryn keys …` (on-demand signing-key rotation). Granted to this client by oathy hub
        # V183 before any CLI release requests it.
        - tenant:keys.read
        - tenant:keys.rotate
        # SSO-3396 — `thoryn keys retire` (retire a leaked signing key). Granted to this client by oathy hub
        # V189 before any CLI release requests it.
        - tenant:keys.retire
        # SSO-3308 — `thoryn workload-identity trusts …` (secret-less GitHub Actions sign-in). Granted to this
        # client by oathy hub V192 (oathy #3787) before any CLI release requests it; a founder re-applies this
        # file once V192 is deployed.
        - tenant:workload-identity.read
        - tenant:workload-identity.write
      requireAuthorizationConsent: false  # first-party: no consent screen for the platform's own CLI

  - kind: environment
    name: ci
    spec:
      slug: cli-ci
      displayName: "thoryn-cli CI sandbox"
    grants:
      # SSO-3113 / SSO-3690 — the ONLY grant in this file: the CI identity manages this sandbox, and by
      # containment everything inside it (the loopback client below). This is the whole of its reach — it is
      # NOT a workspace admin, and nothing here grants the `cli` login client anything wider.
      # The subject is the `wi_…` client of the `thoryn-cli-ci` workload identity trust — the SAME value as
      # `auth.clientId` in `.thoryn/connection.json` (CiProvisionFileConformanceTest pins the two equal). It is
      # minted by the founder's one-time `thoryn workload-identity trusts create`; paste it here.
      - subject: "client:wi_PASTE_THE_CLIENT_ID_TRUSTS_CREATE_PRINTS"
        relation: manager

  - kind: application
    name: loopback-rp
    environment: ci
    spec:
      displayName: "thoryn-cli CI loopback client"
      clientType: public
      grantTypes: [authorization_code]
      scopes: [openid, profile, email]
      # RFC 8252 loopback redirect (port-agnostic) + OIDC RP-Initiated Logout post-logout URI (SSO-2897).
      redirectUris: ["http://127.0.0.1/callback"]
      postLogoutRedirectUris: ["http://127.0.0.1/"]
