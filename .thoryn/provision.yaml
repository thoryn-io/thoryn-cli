# SSO-3090 (epic SSO-3087) — this repo's PROVISIONING-AS-CODE: the "what I own" half of `.thoryn/`,
# next to `connection.json` ("who I am", SSO-2948). thoryn-cli is the REFERENCE CONSUMER of the
# `thoryn provision plan | apply | destroy` verbs it ships (SSO-3088/3089): its own CI converges this
# file against shared staging, runs against the result, and removes what it created on exit. A customer binds a
# repository to Thoryn the same way — the identical files, the identical verbs.
#
# What this file owns:
#  - `cli` (SSO-3104): the CLI's OWN customer-plane login client — the public PKCE client every
#    `thoryn login --workspace <slug>` signs in with. It lives on the `thoryn` workspace's PRODUCTION
#    plane (no `environment:`), replacing the hub-seeded `thoryn-cli` client on the shared default tenant
#    (the platform is moving everything off that tenant). A founder created it ONCE with
#    `thoryn provision apply` while switched into the `thoryn` workspace; ONE identity converges it since: the CI
#    identity holds the platform `owner` relation on it (SSO-3697), so every `apply` from `main` finds it by its
#    fixed `clientId` and converges its non-secret shape — and `retain: true` (SSO-3715 / SSO-3717) says it is
#    never removed by `destroy` or `--prune`, whoever runs them.
#  - What CI needs (SSO-3090): a SANDBOX environment inside the contract's workspace, and a public
#    loopback OAuth client inside that sandbox.
#
# What this file does NOT own any more — the CI identity (SSO-3690, parent SSO-3659; the credential ladder of
# oauthy ADR 2026-10-14-kubernetes-workload-identity-and-runtime-credential-pull, rung 4 "courier: never"):
#  Until SSO-3690 this file declared `ci`, a confidential `client_credentials` client `cli-ci` whose secret a
#  founder minted once (`apply --secret-file`) and carried into the repository secret
#  `THORYN_CLI_CI_CLIENT_SECRET` — the courier pattern, in the repository that ships the ladder's tooling.
#  The identity is now a GitHub Actions WORKLOAD IDENTITY TRUST on the `thoryn` workspace's production
#  plane (`thoryn workload-identity trusts create`, see `.thoryn/README.md`): the e2e job exchanges its own
#  OIDC token for a short-lived token of the trust's `wi_…` client, so NO secret exists anywhere — not in
#  this file, not in a GitHub secret, not in a receipt. The trust is created ONCE by a founder and is only
#  REFERENCED here (by the `grants:` subjects below) and in `connection.json`. It is DECLARED — adopted by
#  name, with SSO-3689's `kind: workloadIdentityTrust` — in `.thoryn/trusts.provision.yaml`, a file a FOUNDER
#  applies, never this one: a production-plane trust is reached through the WORKSPACE (ownership gate), which
#  the confined CI identity must never hold, and a file cannot declare the trust its own identity signs in
#  with (`workload_identity_trust_is_self`). Declared here, the trust would turn every App plan red.
#
# HOW THIS FILE IS CONVERGED — from code, by the Thoryn GitHub App (SSO-3697, parent SSO-3659; the loop proven on
# thoryn-cicd, oauthy converge ADR 2026-10-13 §3 + Amendment 5). `.github/workflows/thoryn-provisioning.yml`:
#  * a pull request that changes anything under .thoryn/ gets a "Thoryn provisioning plan" check run — the App
#    dispatches `mode=plan`, whose job runs in the UNPROTECTED GitHub environment `thoryn-provision-e2e-plan`
#    and plans this file. ONE identity for plan and apply (SSO-3705; SSO-3699 option B, product owner
#    2026-10-14): the plan job signs in with the SAME `.thoryn/connection.json` as the apply job — the
#    `thoryn-cli-ci` trust's `wi_…` client. What keeps a plan from writing is the trust's PLAN PROFILE on the
#    hub (SSO-3700; declared on `thoryn-cli-ci` as `spec.plan` in `.thoryn/trusts.provision.yaml`, SSO-3704): the
#    hub reads the job token's `environment` claim — a job in the `-plan` environment is minted the READ-ONLY
#    scopes (tenant:environments.read tenant:applications.read tenant:access.read), a job in the reviewed
#    environment the write scopes. No second trust, no second `wi_` client, nothing to paste. Red when the file
#    declares a resource the repository does not own, or a dry run would fail — before merge.
#  * a push to `main` dispatches `mode=apply`: the job runs in the REVIEWED environment `thoryn-provision-e2e`
#    (required reviewers hold it before any token is minted), signs in as `thoryn-cli-ci`, applies with
#    `destroy: false` and `prune: false` (`.thoryn/workflow.yaml`) — never `--prune`, never `destroy` — and ends at
#    "Applied". NOTHING IS WRITTEN BACK (SSO-3717; oauthy ADR 2026-10-15-platform-is-the-ledger-no-committed-
#    provisioning-receipt): since SSO-3715 the engine writes no receipt, so there is no receipt pull request and the
#    job holds `contents: read` only. The platform is the ledger — what this repository owns is its `owner` relation
#    on each resource, readable with `thoryn access` and re-checked by product-api on every DELETE. A dispatched run
#    executes on `main` in BOTH modes, so the GitHub environment is the only pin that separates "may read" from "may
#    write" — the plan profile cannot write whatever this file says.
#  `provision-e2e.yml` (dispatch: apply + confinement assertions + destroy) stays as the manual path. Its `destroy`
#  is OWNER-GATED (SSO-3715): a `client:` identity removes only what the platform says it OWNS, children before
#  environments, and a `retain: true` resource never. So it removes EXACTLY the per-run `loopback-rp` client (the CI
#  identity created it, so it owns it) and leaves `cli` and the `ci` sandbox in place as `retained by the file` rows;
#  the next apply re-creates the loopback client. provision-e2e asserts that from `destroy --output json` on every run.
#
#  HOW THE OLD CLIENT WAS REMOVED — once, by a founder, as a REVIEWED removal (SSO-3690: the retired confidential
#  `cli-ci` client went with `thoryn provision apply --prune --confirm thoryn`, then still receipt-based). Under
#  SSO-3715 `--prune` removes what the signed-in identity OWNS on the platform and the file no longer declares
#  (`GET /api/v1/access/mine?relation=owner`) — the platform is the ledger, so there is no receipt to consult and a
#  person's `--prune` removes nothing (people cannot own; it prunes undeclared grants only). Removals stay a
#  reviewed act: the App-dispatched apply never passes `--prune` (`.thoryn/workflow.yaml`), and `destroy` is never
#  run by a pipeline other than provision-e2e's own teardown of what it created.
#
# The sandbox is a LONG-LIVED FIXTURE, not a per-run throwaway (settled by the product owner,
# 2026-09-16). Creating a resource requires `manager` on its PARENT, and the parent of an environment
# is the workspace — so the confined CI identity structurally CANNOT create or delete an
# environment. A founder created the sandbox once (with this file); every CI run finds it by its fixed
# slug and manages only what lives INSIDE it: the loopback client is created by each run and removed by
# `destroy` on exit. The sandbox is `retain: true` (SSO-3717) so the file SAYS it stays, instead of relying on the
# accident that nobody owns it: `destroy` shows it as `retained by the file` and never plans its removal, which is
# also what keeps every `destroy` of this file off the production plane (no `--confirm` needed). Granting the CI
# identity manager on the WORKSPACE so it could create per-run sandboxes was considered and rejected — by
# containment it would reach the whole production plane, including the `cli` login client above, which is exactly
# what epic SSO-3108 exists to prevent.
#
# `provision-e2e` serialises runs with a concurrency group, so one fixed sandbox is enough. It also
# asserts the confinement itself after every apply: as the CI identity, `thoryn env list` must return ONLY this
# sandbox, and a GET of a foreign environment must answer 404. No secrets live here; none are needed.
# SSO-3704 — the first change to this file planned by the Thoryn App on a pull request (plan profile,
# read-only) and applied on merge behind the thoryn-provision-e2e reviewers (2026-10-15).
apiVersion: thoryn.io/provision/v1
resources:
  # SSO-3104 — the `thoryn` CLI's login client, in the `thoryn` workspace (production plane).
  - kind: application
    name: cli
    # SSO-3697 (product owner, 2026-10-14) — THIS REPOSITORY OWNS the provisioning of the login client. Its CI
    # identity `client:wi_10a7b379c79f7d1353f5798d` (the `thoryn-cli-ci` trust, `.thoryn/connection.json`) holds
    # the platform `owner` relation on `application:cli` — owner ⇒ manager (oauthy ADR
    # 2026-10-13-platform-owner-relation-and-forward-check) — so `thoryn-provisioning.yml` converges the login
    # client from `main` like every other declared resource: a change to it is a reviewed pull request to THIS
    # file, not a founder command. `owner` is a ONE-TIME admin grant from a founder's own session
    # (`thoryn access grant client:wi_10a7b379c79f7d1353f5798d owner application:cli`, see `.thoryn/README.md`)
    # and is deliberately NOT in a `grants:` block: the engine refuses `relation: owner` there (SSO-3673) — a
    # repository cannot claim ownership by writing YAML. Until SSO-3690 this entry was `readOnly: true` with a
    # founder-granted `viewer`; that grant is revoked as redundant once `owner` is set.
    # The fixed `clientId` is the converge key: the client exists (a founder created it once), so every apply finds
    # it live and converges its non-secret shape — the first apply of an existing resource is not an event (SSO-3715
    # retired the receipt's `adopted` bit). `retain: true` is the declared replacement: converged and owned, but never
    # removed by `destroy` / `--prune` — the destroy plan shows it as `retained by the file`. Without it an owner-gated
    # destroy by the CI identity (the owner) WOULD remove the CLI's login client (it is on the production plane, so
    # `--confirm thoryn` would still be required — the ADR's rejected "owner-based destroy with no retain:").
    # The plan identity IS this owner (SSO-3705 — SSO-3699 option B: one trust with a plan profile), so a PR's
    # plan check sees the owner planning its own resource; SSO-3697's `owned_elsewhere` gap is gone by design.
    retain: true
    spec:
      clientId: cli                       # fixed id: ThorynConfig.DEFAULT_CLIENT_ID signs in with it
      displayName: "Thoryn CLI"
      clientType: public                  # RFC 8252 native app: PKCE, no secret
      grantTypes:
        - authorization_code
        - refresh_token
        - "urn:ietf:params:oauth:grant-type:device_code"   # `thoryn login --device-code`
      # RFC 8252 §7.3 literal-IP loopback redirects (port-agnostic); the CLI binds an ephemeral port.
      redirectUris: ["http://127.0.0.1/callback", "http://[::1]/callback"]
      # Exactly the scopes any `thoryn` command can request (CiProvisionFileConformanceTest pins this to
      # the CLI's sources); the hub grants a login only what the client holds AND the admin actually has.
      scopes:
        - openid
        - offline_access
        - tenant:applications.read
        - tenant:applications.write
        - tenant:clients.read
        - tenant:users.read
        - tenant:users.write
        - tenant:federation.read
        - tenant:federation.write
        - tenant:audit.read
        - tenant:environments.read
        - tenant:environments.write
        - tenant:email.read
        - tenant:email.write
        - tenant:idp.read
        - tenant:idp.write
        # SSO-3113 — `thoryn access …` + the `grants:` block of a provisioning file. Grantable only once
        # the product side (SSO-3112) has deployed the scopes; a founder re-applies this file after that.
        - tenant:access.read
        - tenant:access.write
        # SSO-3303 — `thoryn domain …` (the workspace's custom domain). Granted to this client by oathy hub
        # V181 before any CLI release requests it, so converging this file finds it already present.
        - tenant:domains.read
        - tenant:domains.write
        # SSO-3369 — `thoryn keys …` (on-demand signing-key rotation). Granted to this client by oathy hub
        # V183 before any CLI release requests it.
        - tenant:keys.read
        - tenant:keys.rotate
        # SSO-3396 — `thoryn keys retire` (retire a leaked signing key). Granted to this client by oathy hub
        # V189 before any CLI release requests it.
        - tenant:keys.retire
        # SSO-3308 — `thoryn workload-identity trusts …` (secret-less GitHub Actions sign-in). Granted to this
        # client by oathy hub V192 (oathy #3787) before any CLI release requests it; a founder re-applies this
        # file once V192 is deployed.
        - tenant:workload-identity.read
        - tenant:workload-identity.write
        # SSO-3856 — the workspace's GitHub connection (oathy SSO-3847). No `thoryn` command calls it yet: the login
        # client carries the family so a workspace admin holds it and can grant it onward (oathy ADR
        # 2026-10-19-operator-grants-platform-client-scopes, "The grant order"). Granted to this client by oathy hub
        # V206 (SSO-3855) before any CLI release requests it, so converging this file finds it already present.
        - tenant:github-connections.read
        - tenant:github-connections.write
      requireAuthorizationConsent: false  # first-party: no consent screen for the platform's own CLI

  - kind: environment
    name: ci
    # SSO-3717 — a long-lived fixture, declared so: `destroy` / `--prune` never remove it (the plan shows
    # `retained by the file`), and the loopback client below is the ONE thing a provision-e2e destroy removes.
    retain: true
    spec:
      slug: cli-ci
      displayName: "thoryn-cli CI sandbox"
    grants:
      # SSO-3113 / SSO-3690 — the ONLY grant in this file: the CI identity manages this sandbox, and by
      # containment everything inside it (the loopback client below). This is the whole of its reach — it is
      # NOT a workspace admin, and nothing here grants the `cli` login client anything wider.
      # The subject is the `wi_…` client of the `thoryn-cli-ci` workload identity trust — the SAME value as
      # `auth.clientId` in `.thoryn/connection.json` (CiProvisionFileConformanceTest pins the two equal, and that
      # it is the ONLY subject here). ONE identity for plan and apply (SSO-3705; SSO-3699 option B): the plan job
      # signs in as this same client and the trust's plan profile (SSO-3700; `spec.plan` in
      # `.thoryn/trusts.provision.yaml`, SSO-3704) mints it read-only scopes in the `-plan` environment — `manager`
      # reach lets it plan the sandbox and its loopback client, the scopes keep it from writing. SSO-3697's second grant, for a never-created plan trust's placeholder client, is what
      # stopped provision-e2e run 38547022158 with `404 not_found — No such access-grant target`; there is no
      # second `wi_` to paste, so a placeholder must never return here.
      - subject: "client:wi_10a7b379c79f7d1353f5798d"
        relation: manager

  # The per-run fixture: created inside the sandbox by each apply (the CI identity creates it, so the platform
  # makes it the `owner` — SSO-3673), removed by provision-e2e's `destroy` on exit (owner-gated, SSO-3715) and
  # re-created by the next apply. The ONLY resource of this file a destroy removes.
  - kind: application
    name: loopback-rp
    environment: ci
    spec:
      displayName: "thoryn-cli CI loopback client"
      clientType: public
      grantTypes: [authorization_code]
      scopes: [openid, profile, email]
      # RFC 8252 loopback redirect (port-agnostic) + OIDC RP-Initiated Logout post-logout URI (SSO-2897).
      redirectUris: ["http://127.0.0.1/callback"]
      postLogoutRedirectUris: ["http://127.0.0.1/"]
