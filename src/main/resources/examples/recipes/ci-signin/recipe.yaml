# SSO-2944 (epic SSO-2934) — the WORKSPACE-LESS bootstrap recipe.
#
# `ci-signin` is the sibling of `simple-signin` for a customer-plane `client_credentials` API key.
# Such a key is tenant-scoped (bound to ONE workspace via its `tnt` claim) and CANNOT create
# workspaces (workspace-create needs a machine scope a tenant admin can't delegate — the SSO-2943
# gap). So instead of minting a fresh workspace per run, this recipe provisions an EPHEMERAL public
# loopback OAuth client INSIDE a STANDING workspace the operator already owns (the one the API key is
# scoped to), and tears down only that app on exit.
#
# There is deliberately NO per-run user step: the recipe schema has no identity user-DELETE teardown
# action, so a per-run user would leak. Sign-in is exercised by a STANDING test user the operator
# creates ONCE (see README) — the ephemeral OAuth client is the sole per-run resource.
#
# Because there is no `hub.createWorkspace` step, the interpreter (SSO-2944) authenticates the
# applications.create / .get / .delete calls with the caller's OWN tenant-scoped bearer directly — no
# provisioning token, no token-exchange.
apiVersion: thoryn.io/examples/v1
id: ci-signin
version: 1.0.0
summary: Provision an ephemeral loopback OAuth client inside a standing workspace (no workspace create).

requires:
  scopes:
    # applications.create (write) + the post-create applications.get verify (read).
    - tenant:applications.write
    - tenant:applications.read
  minCliVersion: 0.9.0

params:
  - name: workspaceSlug
    prompt: "Standing workspace slug (the workspace your API key is scoped to; NOT created)"
    # No default: this MUST name an existing workspace the caller owns. CI passes it via
    # `--set workspaceSlug=<slug>`; the guided `apply` prompts for it.
    validate: "^[a-z0-9]([a-z0-9-]{1,61}[a-z0-9])$"
  - name: appName
    prompt: "Display name for the ephemeral OAuth client"
    # {{generate.slug8}} expands to 8 random hex chars so each run's app is individually identifiable
    # in the console (the clientId is server-generated regardless, so this is only cosmetic).
    default: "CI Sign-in App {{generate.slug8}}"

steps:
  - id: app
    action: applications.create
    description: Register an ephemeral public loopback authorization-code client in the standing workspace.
    with:
      displayName: "{{appName}}"
      clientType: public
      grantTypes: ["authorization_code"]
      scopes: ["openid", "profile", "email"]
      redirectUris: ["http://127.0.0.1/callback"]
      # SSO-2897 — OIDC RP-Initiated Logout: the loopback RP posts end_session with a
      # post_logout_redirect_uri on this loopback host (port-agnostic, like redirectUris).
      postLogoutRedirectUris: ["http://127.0.0.1/"]

verify:
  - assert: applications.get
    id: "{{app.clientId}}"
    expect:
      status: active

# Teardown removes the sole ephemeral resource — the app. There is NO workspace to hard-delete (the
# standing workspace is the operator's and MUST survive), and no user (the standing test user is the
# operator's too). This is the whole reason ci-signin exists alongside simple-signin.
teardown:
  - action: applications.delete
    id: "{{app.clientId}}"

assets:
  rp: ./apps/loopback-rp
  docs: ./README.md
