# GraalVM native-image hints for the thoryn CLI (SSO-794).
#
# These flags are merged into the native-image command line whenever this jar
# is on the classpath. Keep this file in sync with reflect-config.json and
# resource-config.json in the same directory.
#
# Why each flag:
#
#  -H:+ReportExceptionStackTraces — verbose stack traces on classpath issues at
#  build time. Costs nothing at runtime; saves a lot of head-scratching when a
#  reflective entry is missing.
#
#  --initialize-at-run-time=com.sun.jna  — JNA cannot be initialized at build
#  time because it loads platform-specific .dylib/.so/.dll files from disk. If
#  JNA classes get included in the build-time heap, native-image errors out
#  with `com.oracle.svm.core.util.UserError$UserException: Classes that should
#  be initialized at run time got initialized during image building`. The
#  `com.sun.jna` package is the safe granular boundary used by upstream JNA
#  documentation.
#
#  --initialize-at-run-time=org.freedesktop  — same rationale for the dbus-java
#  bits used by Linux Secret Service. Its `org.freedesktop.dbus` and
#  `org.freedesktop.secret` packages set up D-Bus listeners on classload.
#
# Note: java-keyring 1.0.4 itself does not ship META-INF/native-image hints
# (verified against the published jar 2026-04). When upstream adds them, this
# file can shrink to just the project-specific entries.
Args = -H:+ReportExceptionStackTraces \
       --initialize-at-run-time=com.sun.jna \
       --initialize-at-run-time=org.freedesktop
